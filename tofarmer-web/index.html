<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isoteri Kopi - Kedai ToFarmer</title>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Image Upload Manager (auto compress + WebP) -->
  <script src="../js/image-upload-manager.js"></script>
  
  <!-- Timezone Manager (correct time display) -->
  <script src="../js/timezone-manager.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050b07;
      color: #d4af37;
    }
    
    /* KEDAI */
    .kedai {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* area meja */
    .ruang {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, rgba(212, 175, 55, 0.1), transparent 40%),
        linear-gradient(#0f0c0a, #050403);
    }
    
    /* meja */
    .meja {
      width: 280px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #5a3a20, #182a15);
      box-shadow: 0 40px 80px #000;
      position: relative;
    }
    
    /* cangkir */
    .cangkir {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #d4af37;
      color: #1a1410;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      cursor: pointer;
      animation: muncul 0.5s;
      font-weight: bold;
    }
    
    .c1 {
      left: 70px;
      top: -20px;
    }
    
    .c2 {
      right: 70px;
      top: -20px;
    }
    
    .penjaga {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: #d4af37;
      text-align: center;
      width: 100%;
    }
    
    @keyframes muncul {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
      }
    }
    
    /* CHAT */
    .chat {
      height: 40%;
      background: #0d0a07;
      border-top: 2px solid #3d6f2e;
      display: flex;
      flex-direction: column;
    }
    
    .pesan {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    
    .bubble {
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 13px;
    }
    
    .nama {
      color: #d4af37;
      font-size: 11px;
      font-weight: bold;
    }
    
    .konten {
      color: #b0b0b0;
      margin-top: 3px;
      word-wrap: break-word;
    }
    
    .waktu {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }
    
    /* IMAGE PREVIEW */
    .image-preview-container {
      display: none;
      padding: 10px;
      border-bottom: 1px solid #3d6f2e;
    }
    
    .image-preview-container.show {
      display: block;
    }
    
    .image-preview-container img {
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .image-size-info {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }
    
    /* INPUT */
    .input {
      display: flex;
      padding: 10px;
      gap: 8px;
      border-top: 1px solid #3d6f2e;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    
    input[type="text"] {
      flex: 1;
      min-width: 150px;
      background: #16100a;
      border: 1px solid #3d6f2e;
      padding: 10px;
      color: #d4af37;
      border-radius: 8px;
      font-size: 13px;
    }
    
    input[type="text"]::placeholder {
      color: #666;
    }
    
    button {
      background: #3d6f2e;
      border: 1px solid #5a9b3f;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    button:hover {
      background: #5a9b3f;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 5px;
    }
    
    .status-indicator.offline {
      background: #ef4444;
    }
    
    /* pintu/masuk */
    .pintu {
      position: absolute;
      right: 20px;
      top: 20px;
      color: #d4af37;
      font-size: 12px;
      cursor: pointer;
      background: #3d6f2e;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #5a9b3f;
      transition: all 0.2s;
    }
    
    .pintu:hover {
      background: #5a9b3f;
    }
    
    /* user info */
    .user-info {
      position: absolute;
      left: 20px;
      top: 20px;
      color: #d4af37;
      font-size: 12px;
      background: #3d6f2e;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #5a9b3f;
    }
    
    .user-info .member {
      color: #4ade80;
    }
    
    /* upload button */
    .upload-btn {
      background: #3d6f2e;
      border: 1px solid #5a9b3f;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .upload-btn:hover {
      background: #5a9b3f;
    }
    
    .upload-btn:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .error-message {
      color: #ef4444;
      font-size: 11px;
      padding: 8px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 4px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="kedai">
    <!-- RUANG MEJA -->
    <div class="ruang">
      <!-- User Info -->
      <div class="user-info">
        👤 <span id="user-display">Pengunjung</span>
        <span class="member" id="member-badge" style="display:none;">✓ Member</span>
        <div style="margin-top: 5px;">
          <span class="status-indicator" id="status-indicator"></span>
          <span id="status-text" style="font-size: 10px;">Connecting...</span>
        </div>
      </div>
      
      <!-- Pintu/Masuk -->
      <div class="pintu" onclick="bukaPintu()">
        🚪 ToFarmer
      </div>
      
      <!-- Meja -->
      <div class="meja">
        <div class="cangkir c1" style="display: none;">☕</div>
        <div class="cangkir c2" style="display: none;">☕</div>
      </div>
      
      <!-- Penjaga -->
      <div class="penjaga">
        ☕ Kedai Terbuka | Silakan Duduk & Berbagi
      </div>
    </div>
    
    <!-- CHAT -->
    <div class="chat">
      <!-- Pesan Area -->
      <div class="pesan" id="pesan">
        <!-- Messages akan di-append di sini -->
      </div>
      
      <!-- Image Preview -->
      <div class="image-preview-container" id="image-preview-container">
        <img id="image-preview" src="" alt="Preview">
        <div class="image-size-info" id="image-size-info"></div>
        <button onclick="hapusGambar()" style="width: 100%; margin-bottom: 5px;">❌ Hapus Gambar</button>
      </div>
      
      <!-- Error Message -->
      <div id="error-message" class="error-message" style="display: none;"></div>
      
      <!-- Input Area -->
      <div class="input">
        <input 
          type="text" 
          id="teks" 
          placeholder="Tulis sesuatu..."
          onkeydown="handleKeydown(event)"
        >
        <button class="upload-btn" id="upload-btn" onclick="document.getElementById('upload-image').click()">
          🖼️ Gambar
        </button>
        <input type="file" id="upload-image" accept="image/*">
        <button id="send-btn" onclick="kirim()">📤 Kirim</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIGURATION ==========
    const CONFIG = {
      SUPABASE_URL: "https://afpzddwuikvwsedzgsee.supabase.co",
      SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHpkZHd1aWt2d3NlZHpnc2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1MTI4MjIsImV4cCI6MjAxNTI4ODgyMn0.O_IezV8HpBjuZndnXosifts-jS7NnV4VtidyIX1KMHY",
      MAX_IMAGE_SIZE_KB: 500,
      MAX_MESSAGE_LENGTH: 2000,
      RATE_LIMIT_MS: 500, // minimum ms between sends
      TABLE_NAME: 'lounge_messages',
      CHANNEL: 'mejabar'
    };

    // ========== GLOBAL STATE ==========
    let supabaseClient = null;
    let userAlias = null;
    let userWallet = localStorage.getItem('tof_wallet');
    let userUsername = localStorage.getItem('tof_login_username');
    let isLoggedIn = !!(userWallet && userUsername);
    let currentRoom = CONFIG.CHANNEL;
    let pendingImage = null;
    let tzManager = null;
    let isOnline = false;
    let lastMessageTime = 0;
    let subscription = null;
    let sessionId = null;
    let isInitialized = false;

    // ========== POLYFILLS ==========
    if (typeof TimezoneManager === 'undefined') {
      window.TimezoneManager = class {
        constructor(){ this.userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone; }
        createUTCTimestamp(){ return new Date().toISOString(); }
        formatTimestamp(v){ return new Date(v).toLocaleString('id-ID'); }
        formatRelativeTime(){ return 'baru saja'; }
      };
    }

    if (typeof ImageUploadManager === 'undefined') {
      window.ImageUploadManager = class {
        constructor(){ }
        compressImage(file, cb){
          const r = new FileReader();
          r.onload=()=>cb({dataUrl:r.result, blob:file, sizeKB:Math.round(file.size/1024)});
          r.readAsDataURL(file);
        }
      };
    }
    
    // ========== GLOBAL EVENT HANDLERS ==========
    
    function bukaPintu() {
      if (isLoggedIn) {
        alert('Anda sudah masuk sebagai ' + userUsername);
      } else {
        window.location.href = '../html/login.html';
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    }

    function hapusGambar() {
      pendingImage = null;
      document.getElementById('image-preview-container').classList.remove('show');
      document.getElementById('image-preview').src = '';
      clearErrorMessage();
    }

    async function kirim() {
      const input = document.getElementById('teks');
      const isi = input.value.trim();
      
      if (!isi && !pendingImage) {
        showErrorMessage('Tulis pesan atau upload gambar');
        return;
      }

      // Rate limiting
      const now = Date.now();
      if (now - lastMessageTime < CONFIG.RATE_LIMIT_MS) {
        showErrorMessage('Tunggu sebentar sebelum kirim lagi');
        return;
      }

      // Validation
      if (isi && isi.length > CONFIG.MAX_MESSAGE_LENGTH) {
        showErrorMessage(`Pesan terlalu panjang (max ${CONFIG.MAX_MESSAGE_LENGTH} karakter)`);
        return;
      }

      // Disable button
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      sendBtn.textContent = '⏳ Mengirim...';
      
      const timestamp = tzManager ? tzManager.createUTCTimestamp() : new Date().toISOString();
      
      const msg = {
        sender: userAlias,
        content: isi || '📸 Shared image',
        channel: currentRoom,
        is_bot: false,
        created_at: timestamp,
        image_data: pendingImage?.dataUrl || null,
        image_size_kb: pendingImage?.sizeKB || null,
        session_id: sessionId
      };
      
      try {
        if (!supabaseClient) {
          // Offline mode - show locally only
          tampilkanPesan(msg);
          input.value = '';
          hapusGambar();
          return;
        }
        
        const { data, error } = await supabaseClient
          .from(CONFIG.TABLE_NAME)
          .insert([msg])
          .select();
        
        if (error) {
          console.error('Supabase error:', error);
          showErrorMessage('Gagal mengirim pesan: ' + error.message);
          return;
        }

        lastMessageTime = now;
        input.value = '';
        hapusGambar();
        clearErrorMessage();
      } catch (e) {
        console.error('Send error:', e);
        showErrorMessage('Error: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '📤 Kirim';
      }
    }

    // ========== HELPER FUNCTIONS ==========
    
    function generateRandomAlias() {
      const words = ['Tenang', 'Santai', 'Ngopi', 'Gumun', 'Adem', 'Halus'];
      const suffixes = ['Bunga', 'Kopi', 'Daun', 'Angin', 'Bumi', 'Langit'];
      const num = Math.floor(Math.random() * 1000);
      const w = words[Math.floor(Math.random() * words.length)];
      const s = suffixes[Math.floor(Math.random() * suffixes.length)];
      return `${w}${s}#${num}`;
    }

    function generateSessionId() {
      return 'session_' + Date.now() + '_' + Math.random().toString(36).substring(7);
    }

    function updateUI() {
      const userDisplay = document.getElementById('user-display');
      const memberBadge = document.getElementById('member-badge');
      
      if (isLoggedIn) {
        userDisplay.textContent = '@' + userUsername;
        memberBadge.style.display = 'inline';
      } else {
        userDisplay.textContent = userAlias;
        memberBadge.style.display = 'none';
      }
    }

    function updateStatus(online = false) {
      isOnline = online;
      const indicator = document.getElementById('status-indicator');
      const statusText = document.getElementById('status-text');
      const uploadBtn = document.getElementById('upload-btn');
      const sendBtn = document.getElementById('send-btn');
      
      if (online) {
        indicator.classList.remove('offline');
        statusText.textContent = 'Online';
        uploadBtn.disabled = false;
        sendBtn.disabled = false;
      } else {
        indicator.classList.add('offline');
        statusText.textContent = 'Offline';
        uploadBtn.disabled = true;
        sendBtn.disabled = true;
      }
    }

    function showErrorMessage(msg) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
      setTimeout(() => clearErrorMessage(), 5000);
    }

    function clearErrorMessage() {
      document.getElementById('error-message').style.display = 'none';
    }

    function setupImageUpload() {
      const uploadInput = document.getElementById('upload-image');
      uploadInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        if (!file.type.startsWith('image/')) {
          showErrorMessage('Hanya file gambar yang didukung');
          uploadInput.value = '';
          return;
        }

        if (file.size / 1024 > CONFIG.MAX_IMAGE_SIZE_KB) {
          showErrorMessage(`Gambar terlalu besar (max ${CONFIG.MAX_IMAGE_SIZE_KB}KB)`);
          uploadInput.value = '';
          return;
        }
        
        try {
          const imgMgr = new ImageUploadManager();
          imgMgr.compressImage(file, (result) => {
            if (result.error) {
              showErrorMessage('Error: ' + result.error);
              return;
            }
            
            const sizeKB = Math.round(result.blob.size / 1024);
            
            pendingImage = {
              dataUrl: result.dataUrl,
              blob: result.blob,
              sizeKB: sizeKB
            };
            
            const container = document.getElementById('image-preview-container');
            const preview = document.getElementById('image-preview');
            const sizeInfo = document.getElementById('image-size-info');
            
            container.classList.add('show');
            preview.src = result.dataUrl;
            sizeInfo.textContent = `📸 ${sizeKB}KB`;
            clearErrorMessage();
          });
        } catch (e) {
          console.error('Upload error:', e);
          showErrorMessage('Upload error: ' + e.message);
        }
        
        uploadInput.value = '';
      });
    }

    function tampilkanPesan(msg, scroll = true) {
      const area = document.getElementById('pesan');
      
      const waktu = tzManager ? tzManager.formatRelativeTime(msg.created_at) : 'Recent';
      const timeStr = tzManager ? tzManager.formatTimestamp(msg.created_at) : new Date(msg.created_at).toLocaleString('id-ID');
      
      let html = `
        <div class="bubble">
          <div class="nama">${escapeHtml(msg.sender)}</div>
          <div class="konten">${escapeHtml(msg.content)}</div>
      `;
      
      if (msg.image_data) {
        const sizeInfo = msg.image_size_kb ? ` (${msg.image_size_kb}KB)` : '';
        html += `<img src="${msg.image_data}" style="max-width:120px; max-height:120px; border-radius:6px; margin-top:5px;" title="Gambar${sizeInfo}">`;
      }
      
      html += `<div class="waktu">${timeStr}</div></div>`;
      
      area.innerHTML += html;
      
      if (scroll) {
        area.scrollTop = area.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadMessages() {
      if (!supabaseClient) {
        console.warn('Supabase not ready');
        return;
      }
      
      try {
        updateStatus(true);
        
        const { data, error } = await supabaseClient
          .from(CONFIG.TABLE_NAME)
          .select('*')
          .eq('channel', currentRoom)
          .order('created_at', { ascending: true })
          .limit(100);
        
        if (error) {
          console.error('Load error:', error);
          showErrorMessage('Tidak bisa memuat pesan');
          updateStatus(false);
          return;
        }

        // Clear existing messages (except greeting)
        const pesan = document.getElementById('pesan');
        const existing = pesan.querySelectorAll('.bubble');
        if (existing.length <= 1) {
          // Keep greeting, load new messages
        }

        if (data && data.length > 0) {
          data.forEach(msg => tampilkanPesan(msg, false));
        }

        // Auto-scroll to bottom
        setTimeout(() => {
          pesan.scrollTop = pesan.scrollHeight;
        }, 100);

      } catch (e) {
        console.error('Load error:', e);
        updateStatus(false);
      }
    }

    async function subscribeToMessages() {
      if (!supabaseClient) return;

      // Unsubscribe from old subscription
      if (subscription) {
        await supabaseClient.removeChannel(subscription);
      }

      subscription = supabaseClient
        .channel(`public:${CONFIG.TABLE_NAME}:channel=eq.${currentRoom}`)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: CONFIG.TABLE_NAME,
            filter: `channel=eq.${currentRoom}`
          },
          (payload) => {
            const msg = payload.new;
            tampilkanPesan(msg);
            updateStatus(true);
          }
        )
        .subscribe((status) => {
          console.log('Subscription status:', status);
          if (status === 'SUBSCRIBED') {
            updateStatus(true);
          } else if (status === 'CHANNEL_ERROR') {
            updateStatus(false);
            // Retry subscription after delay
            setTimeout(subscribeToMessages, 5000);
          }
        });
    }

    async function init() {
      try {
        // Initialize userAlias & session
        userAlias = localStorage.getItem('tofarmer_alias') || generateRandomAlias();
        sessionId = generateSessionId();
        localStorage.setItem('tofarmer_alias', userAlias);
        localStorage.setItem('tofarmer_session', sessionId);
        
        // Supabase
        try {
          if (window.supabase && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            console.log('✓ Supabase initialized');
          }
        } catch (e) {
          console.error('Supabase init error:', e);
          updateStatus(false);
        }
        
        // Timezone
        try {
          if (typeof TimezoneManager !== 'undefined') {
            tzManager = new TimezoneManager();
            console.log('✓ Timezone:', tzManager.userTimezone);
          }
        } catch (e) {
          console.error('Timezone init error:', e);
        }
        
        // UI
        updateUI();
        
        // Image upload setup
        setupImageUpload();
        
        // Load messages
        await loadMessages();
        
        // Subscribe to realtime
        await subscribeToMessages();
        
        isInitialized = true;
        console.log('✓ Isoteri Kopi initialized');
        
      } catch (e) {
        console.error('Init error:', e);
        updateStatus(false);
      }
    }
    
    // ========== LIFECYCLE ==========
    window.addEventListener('load', () => {
      init();
    });

    // Handle online/offline events
    window.addEventListener('online', () => {
      console.log('Browser online');
      if (isInitialized) {
        subscribeToMessages();
        loadMessages();
      }
    });

    window.addEventListener('offline', () => {
      console.log('Browser offline');
      updateStatus(false);
    });
  </script>
</body>
</html>
