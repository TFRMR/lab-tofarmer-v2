<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isoteri Kopi - Kedai ToFarmer</title>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Image Upload Manager (auto compress + WebP) -->
  <script src="../js/image-upload-manager.js"></script>
  
  <!-- Timezone Manager (correct time display) -->
  <script src="../js/timezone-manager.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050b07;
      color: #d4af37;
    }
    
    /* KEDAI */
    .kedai {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* area meja */
    .ruang {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, rgba(212, 175, 55, 0.1), transparent 40%),
        linear-gradient(#0f0c0a, #050403);
    }
    
    /* meja */
    .meja {
      width: 280px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #5a3a20, #182a15);
      box-shadow: 0 40px 80px #000;
      position: relative;
    }
    
    /* cangkir */
    .cangkir {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #d4af37;
      color: #1a1410;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      cursor: pointer;
      animation: muncul 0.5s;
      font-weight: bold;
    }
    
    .c1 {
      left: 70px;
      top: -20px;
    }
    
    .c2 {
      right: 70px;
      top: -20px;
    }
    
    .penjaga {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: #d4af37;
      text-align: center;
      width: 100%;
    }
    
    @keyframes muncul {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
      }
    }
    
    /* CHAT */
    .chat {
      height: 40%;
      background: #0d0a07;
      border-top: 2px solid #3d6f2e;
      display: flex;
      flex-direction: column;
    }
    
    .pesan {
      flex: 1;
      overflow: auto;
      padding: 15px;
    }
    
    .bubble {
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 13px;
    }
    
    .nama {
      color: #d4af37;
      font-size: 11px;
      font-weight: bold;
    }
    
    .konten {
      color: #b0b0b0;
      margin-top: 3px;
    }
    
    .waktu {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }
    
    /* IMAGE PREVIEW */
    .image-preview-container {
      display: none;
      padding: 10px;
      border-bottom: 1px solid #3d6f2e;
    }
    
    .image-preview-container.show {
      display: block;
    }
    
    .image-preview-container img {
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    /* INPUT */
    .input {
      display: flex;
      padding: 10px;
      gap: 8px;
      border-top: 1px solid #3d6f2e;
      align-items: flex-end;
    }
    
    input {
      flex: 1;
      background: #16100a;
      border: 1px solid #3d6f2e;
      padding: 10px;
      color: #d4af37;
      border-radius: 8px;
      font-size: 13px;
    }
    
    input::placeholder {
      color: #666;
    }
    
    button {
      background: #3d6f2e;
      border: 1px solid #5a9b3f;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #5a9b3f;
    }
    
    /* pintu/masuk */
    .pintu {
      position: absolute;
      right: 20px;
      top: 20px;
      color: #d4af37;
      font-size: 12px;
      cursor: pointer;
      background: #3d6f2e;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #5a9b3f;
      transition: all 0.2s;
    }
    
    .pintu:hover {
      background: #5a9b3f;
    }
    
    /* user info */
    .user-info {
      position: absolute;
      left: 20px;
      top: 20px;
      color: #d4af37;
      font-size: 12px;
      background: #3d6f2e;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #5a9b3f;
    }
    
    .user-info .member {
      color: #4ade80;
    }
    
    /* upload button */
    .upload-btn {
      background: #3d6f2e;
      border: 1px solid #5a9b3f;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
      margin-right: 5px;
      transition: all 0.2s;
    }
    
    .upload-btn:hover {
      background: #5a9b3f;
    }
    
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="kedai">
    <!-- RUANG MEJA -->
    <div class="ruang">
      <!-- User Info -->
      <div class="user-info">
        👤 <span id="user-display">Pengunjung</span>
        <span class="member" id="member-badge" style="display:none;">✓ Member</span>
      </div>
      
      <!-- Pintu/Masuk -->
      <div class="pintu" onclick="bukaPintu()">
        🚪 ToFarmer
      </div>
      
      <!-- Meja -->
      <div class="meja">
        <div class="cangkir c1">☕</div>
        <div class="cangkir c2">☕</div>
      </div>
      
      <!-- Penjaga -->
      <div class="penjaga">
        ☕ Kedai Terbuka | Silakan Duduk & Berbagi
      </div>
    </div>
    
    <!-- CHAT -->
    <div class="chat">
      <!-- Pesan Area -->
      <div class="pesan" id="pesan">
        <div class="bubble">
          <div class="nama">🤖 Barista ToFarmer</div>
          <div class="konten">Selamat datang di Isoteri Kopi ☕</div>
          <div class="waktu">Baru saja</div>
        </div>
      </div>
      
      <!-- Image Preview -->
      <div class="image-preview-container" id="image-preview-container">
        <img id="image-preview" src="" alt="Preview">
        <button onclick="hapusGambar()" style="width: 100%; margin-bottom: 5px;">❌ Hapus Gambar</button>
      </div>
      
      <!-- Input Area -->
      <div class="input">
        <input 
          type="text" 
          id="teks" 
          placeholder="Tulis sesuatu..."
          onkeydown="handleKeydown(event)"
        >
        <button class="upload-btn" onclick="document.getElementById('upload-image').click()">
          🖼️
        </button>
        <input type="file" id="upload-image" accept="image/*">
        <button onclick="kirim()">Kirim</button>
      </div>
    </div>
  </div>

  <script>
    // ========== INITIALIZATION ==========
    const SUPABASE_URL = "https://afpzddwuikvwsedzgsee.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHpkZHd1aWt2d3NlZHpnc2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1MTI4MjIsImV4cCI6MjAxNTI4ODgyMn0.O_IezV8HpBjuZndnXosifts-jS7NnV4VtidyIX1KMHY";
    
    let supabaseClient;
    let userAlias = null;
    let userWallet = localStorage.getItem('tof_wallet');
    let userUsername = localStorage.getItem('tof_login_username');
    let isLoggedIn = !!(userWallet && userUsername);
    let currentRoom = 'mejabar';
    let pendingImage = null;
    let tzManager = null;

    // Fallback agar kedai tetap hidup jika modul eksternal belum tersedia
    if (typeof TimezoneManager === 'undefined') {
      window.TimezoneManager = class {
        constructor(){ this.userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone; }
        createUTCTimestamp(){ return new Date().toISOString(); }
        formatTimestamp(v){ return new Date(v).toLocaleString('id-ID'); }
        formatRelativeTime(){ return 'baru saja'; }
      };
    }

    if (typeof ImageUploadManager === 'undefined') {
      window.ImageUploadManager = class {
        constructor(){ }
        compressImage(file, cb){
          const r = new FileReader();
          r.onload=()=>cb({dataUrl:r.result, blob:file, sizeKB:Math.round(file.size/1024)});
          r.readAsDataURL(file);
        }
      };
    }
    
    // ========== GLOBAL EVENT HANDLER FUNCTIONS ==========
    // These must be in global scope to work with inline HTML event handlers
    
    function generateRandomAlias() {
      const words = ['Tenang', 'Santai', 'Ngopi', 'Gumun', 'Adem', 'Halus'];
      const suffixes = ['Bunga', 'Kopi', 'Daun', 'Angin', 'Bumi', 'Langit'];
      const num = Math.floor(Math.random() * 1000);
      const w = words[Math.floor(Math.random() * words.length)];
      const s = suffixes[Math.floor(Math.random() * suffixes.length)];
      return `${w}${s}#${num}`;
    }

    function bukaPintu() {
      if (isLoggedIn) {
        alert('Anda sudah masuk sebagai ' + userUsername);
      } else {
        window.location.href = '../html/login.html';
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    }

    function hapusGambar() {
      pendingImage = null;
      document.getElementById('image-preview-container').classList.remove('show');
    }

    async function kirim() {
      const input = document.getElementById('teks');
      const isi = input.value.trim();
      
      if (!isi && !pendingImage) return;
      
      const timestamp = tzManager ? tzManager.createUTCTimestamp() : new Date().toISOString();
      
      const msg = {
        sender: userAlias,
        content: isi || '📸 Shared image',
        channel: currentRoom,
        is_bot: false,
        created_at: timestamp,
        image_data: pendingImage?.dataUrl || null
      };
      
      input.value = '';
      hapusGambar();
      
      if (!supabaseClient) {
        tampilkanPesan(msg);
        return;
      }
      
      const { error } = await supabaseClient
        .from('lounge_messages')
        .insert([msg]);
      
      if (error) {
        console.error('Error:', error);
        alert('Gagal mengirim');
      } else {
        tampilkanPesan(msg);
      }
    }

    // ========== INTERNAL HELPER FUNCTIONS ==========
    
    function updateUI() {
      const userDisplay = document.getElementById('user-display');
      const memberBadge = document.getElementById('member-badge');
      
      if (isLoggedIn) {
        userDisplay.textContent = '@' + userUsername;
        memberBadge.style.display = 'inline';
      } else {
        userDisplay.textContent = userAlias;
        memberBadge.style.display = 'none';
      }
    }
    
    function setupImageUpload() {
      const uploadInput = document.getElementById('upload-image');
      uploadInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        if (!file.type.startsWith('image/')) {
          alert('Hanya file gambar!');
          return;
        }
        
        try {
          const imgMgr = new ImageUploadManager(supabaseClient);
          imgMgr.compressImage(file, (result) => {
            if (result.error) {
              alert('Error: ' + result.error);
              return;
            }
            
            pendingImage = {
              dataUrl: result.dataUrl,
              blob: result.blob,
              sizeKB: result.sizeKB
            };
            
            const container = document.getElementById('image-preview-container');
            const preview = document.getElementById('image-preview');
            container.classList.add('show');
            preview.src = result.dataUrl;
          });
        } catch (e) {
          console.error('Upload error:', e);
        }
        
        uploadInput.value = '';
      });
    }

    function tampilkanPesan(msg, scroll = true) {
      const area = document.getElementById('pesan');
      
      const waktu = tzManager ? tzManager.formatRelativeTime(msg.created_at) : 'Recent';
      const timeStr = tzManager ? tzManager.formatTimestamp(msg.created_at) : '';
      
      let html = `
        <div class="bubble">
          <div class="nama">${msg.sender}</div>
          <div class="konten">${msg.content}</div>
      `;
      
      if (msg.image_data) {
        html += `<img src="${msg.image_data}" style="max-width:120px; max-height:120px; border-radius:6px; margin-top:5px;">`;
      }
      
      html += `<div class="waktu">${timeStr} (${waktu})</div></div>`;
      
      area.innerHTML += html;
      
      if (scroll) {
        area.scrollTop = area.scrollHeight;
      }
    }

    function updateCups(active = false){
      const meja = document.querySelector('.meja');
      if(!meja) return;
      const cups = meja.querySelectorAll('.cangkir');
      cups.forEach(c=>c.style.display = active ? 'flex':'none');
    }

    async function loadMessages() {
      if (!supabaseClient) return;
      
      try {
        const { data } = await supabaseClient
          .from('lounge_messages')
          .select('*')
          .eq('channel', currentRoom)
          .order('created_at', { ascending: true })
          .limit(50);
        
        if (data) {
          data.forEach(msg => tampilkanPesan(msg, false));
        }
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    async function init() {
      // Initialize userAlias first (was causing issues)
      userAlias = localStorage.getItem('tofarmer_alias') || generateRandomAlias();
      
      // Supabase
      try {
        if (window.supabase) {
          const { createClient } = window.supabase;
          supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        }
        console.log('✓ Supabase connected');
      } catch (e) {
        console.error('Supabase init error:', e);
      }
      
      // Timezone
      try {
        if (typeof TimezoneManager !== 'undefined') {
          tzManager = new TimezoneManager();
          console.log('✓ Timezone:', tzManager.userTimezone);
        }
      } catch (e) {
        console.error('Timezone init error:', e);
      }
      
      // UI
      updateUI();
      updateCups(false);
      localStorage.setItem('tofarmer_alias', userAlias);
      
      // Image upload setup
      setupImageUpload();
      
      // Load messages
      loadMessages();
      
      // Subscribe to new messages
      if (supabaseClient) {
        supabaseClient
          .channel('public:lounge_messages')
          .on('postgres_changes', 
            { event: 'INSERT', schema: 'public', table: 'lounge_messages' },
            (payload) => {
              const msg = payload.new;
              if (msg.channel === currentRoom) {
                tampilkanPesan(msg);
              }
            }
          )
          .subscribe();
      }
    }
    
    // Initialize on page load
    window.addEventListener('load', () => {
      init();
    });
  </script>
</body>
</html>
