<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isoteri Kopi - Kedai ToFarmer</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/image-upload-manager.js"></script>
  <script src="../js/timezone-manager.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden;
      font-family: Arial, sans-serif; background: #050b07; color: #d4af37;
    }
    .kedai { height: 100vh; display: flex; flex-direction: column; }
    .ruang {
      flex: 1; position: relative; display: flex;
      justify-content: center; align-items: center;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.1), transparent 40%),
                  linear-gradient(#0f0c0a, #050403);
    }
    .meja {
      width: 280px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle, #5a3a20, #182a15);
      box-shadow: 0 40px 80px #000; position: relative;
    }
    .cangkir {
      position: absolute; width: 45px; height: 45px;
      background: #d4af37; color: #1a1410; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 25px; cursor: pointer; animation: muncul 0.5s; font-weight: bold;
    }
    .c1 { left: 70px; top: -20px; }
    .c2 { right: 70px; top: -20px; }
    .penjaga {
      position: absolute; bottom: 20px; font-size: 13px;
      color: #d4af37; text-align: center; width: 100%;
    }
    @keyframes muncul {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; }
    }
    .chat {
      height: 40%; background: #0d0a07;
      border-top: 2px solid #3d6f2e; display: flex; flex-direction: column;
    }
    .pesan { flex: 1; overflow-y: auto; padding: 15px; }
    .bubble { margin-bottom: 10px; line-height: 1.5; font-size: 13px; }
    .nama { color: #d4af37; font-size: 11px; font-weight: bold; }
    .konten { color: #b0b0b0; margin-top: 3px; word-wrap: break-word; }
    .waktu { font-size: 10px; color: #666; margin-top: 2px; }
    .image-preview-container { display: none; padding: 10px; border-bottom: 1px solid #3d6f2e; }
    .image-preview-container.show { display: block; }
    .image-preview-container img { max-width: 150px; max-height: 150px; border-radius: 8px; margin-bottom: 8px; }
    .image-size-info { font-size: 11px; color: #999; margin-top: 5px; }
    .input {
      display: flex; padding: 10px; gap: 8px;
      border-top: 1px solid #3d6f2e; align-items: flex-end; flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1; min-width: 150px; background: #16100a;
      border: 1px solid #3d6f2e; padding: 10px; color: #d4af37;
      border-radius: 8px; font-size: 13px;
    }
    input[type="text"]::placeholder { color: #666; }
    button {
      background: #3d6f2e; border: 1px solid #5a9b3f; border-radius: 8px;
      padding: 8px 15px; cursor: pointer; color: #d4af37; font-weight: bold;
      font-size: 12px; transition: all 0.2s; white-space: nowrap;
    }
    button:hover { background: #5a9b3f; }
    button:disabled { background: #666; cursor: not-allowed; opacity: 0.5; }
    .status-indicator {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #4ade80; margin-right: 5px;
    }
    .status-indicator.offline { background: #ef4444; }
    .pintu {
      position: absolute; right: 20px; top: 20px; color: #d4af37;
      font-size: 12px; cursor: pointer; background: #3d6f2e;
      padding: 8px 12px; border-radius: 6px; border: 1px solid #5a9b3f;
    }
    .pintu:hover { background: #5a9b3f; }
    .user-info {
      position: absolute; left: 20px; top: 20px; color: #d4af37;
      font-size: 12px; background: #3d6f2e; padding: 8px 12px;
      border-radius: 6px; border: 1px solid #5a9b3f;
    }
    .user-info .member { color: #4ade80; }
    .upload-btn {
      background: #3d6f2e; border: 1px solid #5a9b3f; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; color: #d4af37; font-weight: bold; font-size: 12px;
    }
    input[type="file"] { display: none; }
    .error-message {
      color: #ef4444; font-size: 11px; padding: 8px;
      background: rgba(239, 68, 68, 0.1); border-radius: 4px; margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="kedai">
    <div class="ruang">
      <div class="user-info">
        👤 <span id="user-display">Pengunjung</span>
        <span class="member" id="member-badge" style="display:none;">✓ Member</span>
        <div style="margin-top: 5px;">
          <span class="status-indicator" id="status-indicator"></span>
          <span id="status-text" style="font-size: 10px;">Connecting...</span>
        </div>
      </div>
      
      <div class="pintu" onclick="bukaPintu()">🚪 ToFarmer</div>
      
      <div class="meja">
        <div class="cangkir c1" style="display: none;">☕</div>
        <div class="cangkir c2" style="display: none;">☕</div>
      </div>
      
      <div class="penjaga">☕ Kedai Terbuka | Silakan Duduk & Berbagi</div>
    </div>
    
    <div class="chat">
      <div class="pesan" id="pesan"></div>
      
      <div class="image-preview-container" id="image-preview-container">
        <img id="image-preview" src="" alt="Preview">
        <div class="image-size-info" id="image-size-info"></div>
        <button onclick="hapusGambar()" style="width: 100%; margin-bottom: 5px;">❌ Hapus Gambar</button>
      </div>
      
      <div id="error-message" class="error-message" style="display: none;"></div>
      
      <div class="input">
        <input 
          type="text" 
          id="teks" 
          placeholder="Tulis sesuatu..."
          onkeydown="handleKeydown(event)"
        >
        <button class="upload-btn" id="upload-btn" onclick="document.getElementById('upload-image').click()">
          🖼️ Gambar
        </button>
        <input type="file" id="upload-image" accept="image/*">
        <button id="send-btn" onclick="kirim()">📤 Kirim</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIG & STATE
    const CONFIG = {
      SUPABASE_URL: "https://afpzddwuikvwsedzgsee.supabase.co",
      SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHpkZHd1aWt2d3NlZHpnc2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1MTI4MjIsImV4cCI6MjAxNTI4ODgyMn0.O_IezV8HpBjuZndnXosifts-jS7NnV4VtidyIX1KMHY",
      MAX_IMAGE_SIZE_KB: 500,
      MAX_MESSAGE_LENGTH: 2000,
      RATE_LIMIT_MS: 500,
      TABLE_NAME: 'lounge_messages',
      CHANNEL: 'mejabar'
    };

    let supabaseClient = null;
    let userAlias = null;
    let userWallet = localStorage.getItem('tof_wallet');
    let userUsername = localStorage.getItem('tof_login_username');
    let isLoggedIn = !!(userWallet && userUsername);
    let currentRoom = CONFIG.CHANNEL;
    let pendingImage = null;
    let tzManager = null;
    let lastMessageTime = 0;
    let subscription = null;
    let sessionId = null;
    let isInitialized = false;

    // EVENT HANDLERS
    function bukaPintu() {
      if (isLoggedIn) {
        alert('Anda sudah masuk sebagai ' + userUsername);
      } else {
        window.location.href = '../html/login.html';
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    }

    function hapusGambar() {
      pendingImage = null;
      document.getElementById('image-preview-container').classList.remove('show');
      document.getElementById('image-preview').src = '';
      clearErrorMessage();
    }

    async function kirim() {
      const input = document.getElementById('teks');
      const isi = input.value.trim();
      
      if (!isi && !pendingImage) {
        showErrorMessage('Tulis pesan atau upload gambar');
        return;
      }

      const now = Date.now();
      if (now - lastMessageTime < CONFIG.RATE_LIMIT_MS) {
        showErrorMessage('Tunggu sebentar sebelum kirim lagi');
        return;
      }

      if (isi && isi.length > CONFIG.MAX_MESSAGE_LENGTH) {
        showErrorMessage(`Pesan terlalu panjang (max ${CONFIG.MAX_MESSAGE_LENGTH} karakter)`);
        return;
      }

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      sendBtn.textContent = '⏳ Mengirim...';
      
      const timestamp = tzManager ? tzManager.createUTCTimestamp() : new Date().toISOString();
      
      const msg = {
        sender: userAlias,
        content: isi || '📸 Shared image',
        channel: currentRoom,
        is_bot: false,
        created_at: timestamp,
        image_data: pendingImage?.dataUrl || null,
        image_size_kb: pendingImage?.sizeKB || null,
        session_id: sessionId
      };
      
      try {
        if (!supabaseClient) {
          tampilkanPesan(msg);
          input.value = '';
          hapusGambar();
          return;
        }
        
        const { error } = await supabaseClient
          .from(CONFIG.TABLE_NAME)
          .insert([msg]);
        
        if (error) {
          showErrorMessage('Gagal mengirim pesan: ' + error.message);
          return;
        }

        lastMessageTime = now;
        input.value = '';
        hapusGambar();
        clearErrorMessage();
      } catch (e) {
        showErrorMessage('Error: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '📤 Kirim';
      }
    }

    // UTILITIES
    function generateRandomAlias() {
      const words = ['Tenang', 'Santai', 'Ngopi', 'Gumun', 'Adem', 'Halus'];
      const suffixes = ['Bunga', 'Kopi', 'Daun', 'Angin', 'Bumi', 'Langit'];
      const num = Math.floor(Math.random() * 1000);
      return `${words[Math.floor(Math.random() * words.length)]}${suffixes[Math.floor(Math.random() * suffixes.length)]}#${num}`;
    }

    function generateSessionId() {
      return 'session_' + Date.now() + '_' + Math.random().toString(36).substring(7);
    }

    function updateUI() {
      const userDisplay = document.getElementById('user-display');
      const memberBadge = document.getElementById('member-badge');
      if (isLoggedIn) {
        userDisplay.textContent = '@' + userUsername;
        memberBadge.style.display = 'inline';
      } else {
        userDisplay.textContent = userAlias;
        memberBadge.style.display = 'none';
      }
    }

    function updateStatus(online = false) {
      const indicator = document.getElementById('status-indicator');
      const statusText = document.getElementById('status-text');
      const uploadBtn = document.getElementById('upload-btn');
      const sendBtn = document.getElementById('send-btn');
      
      if (online) {
        indicator.classList.remove('offline');
        statusText.textContent = 'Online';
        uploadBtn.disabled = false;
        sendBtn.disabled = false;
      } else {
        indicator.classList.add('offline');
        statusText.textContent = 'Offline';
        uploadBtn.disabled = true;
        sendBtn.disabled = true;
      }
    }

    function showErrorMessage(msg) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
      setTimeout(() => clearErrorMessage(), 5000);
    }

    function clearErrorMessage() {
      document.getElementById('error-message').style.display = 'none';
    }

    function setupImageUpload() {
      const uploadInput = document.getElementById('upload-image');
      uploadInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        if (!file.type.startsWith('image/')) {
          showErrorMessage('Hanya file gambar yang didukung');
          uploadInput.value = '';
          return;
        }

        if (file.size / 1024 > CONFIG.MAX_IMAGE_SIZE_KB) {
          showErrorMessage(`Gambar terlalu besar (max ${CONFIG.MAX_IMAGE_SIZE_KB}KB)`);
          uploadInput.value = '';
          return;
        }
        
        try {
          const imgMgr = new ImageUploadManager();
          imgMgr.compressImage(file, (result) => {
            if (result.error) {
              showErrorMessage('Error: ' + result.error);
              return;
            }
            const sizeKB = Math.round(result.blob.size / 1024);
            pendingImage = { dataUrl: result.dataUrl, blob: result.blob, sizeKB: sizeKB };
            
            document.getElementById('image-preview-container').classList.add('show');
            document.getElementById('image-preview').src = result.dataUrl;
            document.getElementById('image-size-info').textContent = `📸 ${sizeKB}KB`;
            clearErrorMessage();
          });
        } catch (e) {
          showErrorMessage('Upload error: ' + e.message);
        }
        uploadInput.value = '';
      });
    }

    function tampilkanPesan(msg, scroll = true) {
      const area = document.getElementById('pesan');
      const timeStr = tzManager ? tzManager.formatTimestamp(msg.created_at) : new Date(msg.created_at).toLocaleString('id-ID');
      
      let html = `
        <div class="bubble">
          <div class="nama">${escapeHtml(msg.sender)}</div>
          <div class="konten">${escapeHtml(msg.content)}</div>
      `;
      
      if (msg.image_data) {
        const sizeInfo = msg.image_size_kb ? ` (${msg.image_size_kb}KB)` : '';
        html += `<img src="${msg.image_data}" style="max-width:120px; max-height:120px; border-radius:6px; margin-top:5px;" title="Gambar${sizeInfo}">`;
      }
      
      html += `<div class="waktu">${timeStr}</div></div>`;
      area.innerHTML += html;
      
      if (scroll) {
        area.scrollTop = area.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadMessages() {
      if (!supabaseClient) return;
      try {
        updateStatus(true);
        const { data, error } = await supabaseClient
          .from(CONFIG.TABLE_NAME)
          .select('*')
          .eq('channel', currentRoom)
          .order('created_at', { ascending: true })
          .limit(100);
        
        if (error) {
          showErrorMessage('Tidak bisa memuat pesan');
          updateStatus(false);
          return;
        }

        if (data && data.length > 0) {
          document.getElementById('pesan').innerHTML = '';
          data.forEach(msg => tampilkanPesan(msg, false));
        }

        const pesan = document.getElementById('pesan');
        setTimeout(() => { pesan.scrollTop = pesan.scrollHeight; }, 100);
      } catch (e) {
        updateStatus(false);
      }
    }

    async function subscribeToMessages() {
      if (!supabaseClient) return;
      if (subscription) {
        await supabaseClient.removeChannel(subscription);
      }

      subscription = supabaseClient
        .channel(`public:${CONFIG.TABLE_NAME}:channel=eq.${currentRoom}`)
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: CONFIG.TABLE_NAME, filter: `channel=eq.${currentRoom}` },
          (payload) => {
            tampilkanPesan(payload.new);
            updateStatus(true);
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') updateStatus(true);
          else if (status === 'CHANNEL_ERROR') {
            updateStatus(false);
            setTimeout(subscribeToMessages, 5000);
          }
        });
    }

    async function init() {
      try {
        userAlias = localStorage.getItem('tofarmer_alias') || generateRandomAlias();
        sessionId = generateSessionId();
        localStorage.setItem('tofarmer_alias', userAlias);
        localStorage.setItem('tofarmer_session', sessionId);
        
        if (window.supabase && window.supabase.createClient) {
          supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        }
        
        if (typeof window.TimezoneManager !== 'undefined') {
          tzManager = new window.TimezoneManager();
        }
        
        updateUI();
        setupImageUpload();
        await loadMessages();
        await subscribeToMessages();
        isInitialized = true;
      } catch (e) {
        updateStatus(false);
      }
    }
    
    window.addEventListener('load', init);
    window.addEventListener('online', () => {
      if (isInitialized) {
        subscribeToMessages();
        loadMessages();
      }
    });
    window.addEventListener('offline', () => updateStatus(false));
  </script>
</body>
</html>
