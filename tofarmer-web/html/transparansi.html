<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparansi TOF</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #060c08; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; line-height: 1.6; }
    .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at top right, rgba(234, 179, 8, 0.07) 0%, transparent 45%), radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.08) 0%, transparent 40%), linear-gradient(135deg, #060c08 0%, #0c1c13 50%, #040805 100%); }
    .container { max-width: 850px; width: 92%; padding: 2.5rem 1rem; text-align: center; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.6rem; font-weight: 800; margin: 1.5rem 0 0.5rem; background: linear-gradient(135deg, #fef08a 0%, #4ade80 50%, #22c55e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-timbul { display: flex; justify-content: center; gap: 12px; margin: 15px 0 2.5rem; flex-wrap: wrap; }
    .nav-btn { background: rgba(18, 32, 24, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(74, 222, 128, 0.15); color: #a7f3d0; padding: 10px 22px; border-radius: 50px; text-decoration: none; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; transition: all 0.3s; }
    .nav-btn:hover { background: rgba(34, 197, 94, 0.2); border-color: rgba(234, 179, 8, 0.4); color: #fef08a; transform: translateY(-2px); }
    .card { background: rgba(14, 28, 19, 0.45); backdrop-filter: blur(20px); padding: 2rem; border-radius: 20px; margin-top: 1.2rem; border: 1px solid rgba(255, 255, 255, 0.04); border-left: 3px solid #22c55e; text-align: left; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); }
    #syncBtn { padding: 13px 28px; background: rgba(20, 38, 27, 0.6); border: 1px solid rgba(74, 222, 128, 0.3); color: #4ade80; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin: 1rem 0 0.5rem; }
    #syncBtn:hover { background: #22c55e; color: #050b07; }
    #syncBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { display: block; color: #64748b; font-family: monospace; font-size: 0.75rem; margin-bottom: 1.5rem; }
    hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.25), transparent); margin: 2rem 0; }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div class="container">
    <h1>🌿 Transparansi Radar TOF</h1>
    
    <div class="nav-timbul">
      <a href="https://www.tofarmer.xyz" class="nav-btn">🏠 Titik Kumpul</a>
      <a href="https://www.tofarmer.xyz/html/fitur-ilmu.html" class="nav-btn">📚 Fitur & Info</a>
    </div>

    <div id="summary">
      <div class="card" style="text-align: center; border-left: none; color: #64748b;">
        ⏳ Menghubungkan ke lumbung data...
      </div>
    </div>

    <button id="syncBtn">🔄 Update Laporan Terakhir</button>
    <small id="status">Sistem siap menerima pembaruan...</small>

    <hr>
    <div id="feed"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config-supabase.js"></script>
  <script src="../js/transparansi.js"></script>
</body>
</html>
