<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Komunitas Live</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .card { padding: 10px 14px; border-radius: 8px; background: #f9f9f9; border-left: 4px solid #128c7e; }
    .card.web-user { border-left-color: #34b7f1; background: #e8f5fe; }
    .sender { font-size: 0.8rem; font-weight: bold; color: #075e54; margin-bottom: 3px; }
    .text { font-size: 0.95rem; color: #333; word-wrap: break-word; }
    
    .chat-img { 
      max-width: 100%; 
      max-height: 300px; 
      border-radius: 8px; 
      margin-top: 6px; 
      margin-bottom: 4px;
      display: block;
      object-fit: cover;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .input-area { padding: 10px; background: #eee; display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    button { background: #128c7e; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">Live Forum Komunitas (50 Chat Terbaru)</div>
  <div class="chat-box" id="chatBox"></div>
  
  <div class="input-area">
    <input type="text" id="pesanInput" placeholder="Ikut ngobrol anonim di sini..." />
    <button onclick="kirimPesanWeb()">Kirim</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://afpzddwuikvwsedzgsee.supabase.co"; 
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmcHpkZHd1aWt2d3NlZHpnc2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTExNjEsImV4cCI6MjA5NDcyNzE2MX0.O_IezV8HpBjuZndnXosifts-jS7NnV4VtidyIX1KMHY"; 

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const chatBox = document.getElementById('chatBox');

  async function loadPesanTerbaru() {
    // 🔍 KUNCI PERBAIKAN: Urutkan berdasarkan timestamp ASCENDING/DESCENDING dengan validasi ketat
    const { data: waData } = await db.from('group_messages')
      .select('*')
      .order('timestamp', { ascending: false })
      .limit(100);

    const { data: webData } = await db.from('web_chat')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(50);

    let gabungan = [];
    
    if(waData) {
      waData.forEach(d => gabungan.push({ 
        id: d.message_id, 
        sender: d.sender_name + " (Verified)", 
        text: d.content, 
        imageUrl: d.image_url || null, 
        time: d.timestamp, 
        type: 'wa' 
      }));
    }

    if(webData) {
      webData.forEach(d => gabungan.push({ 
        id: d.id, 
        sender: d.sender_name, 
        text: d.content, 
        imageUrl: null,
        time: d.created_at, 
        type: 'web' 
      }));
    }

    // 💡 Filter & Urutkan berdasarkan nilai Waktu yang valid
    gabungan.sort((a, b) => new Date(a.time).getTime() - new Date(b.time).getTime());
    
    // Ambil 50 data teratas setelah diurutkan kronologis
    gabungan = gabungan.slice(-50);

    chatBox.innerHTML = '';
    gabungan.forEach(m => tampilkanDiLayar(m));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function tampilkanDiLayar(m) {
    if(document.getElementById(`msg-${m.id}`)) return;
    
    const div = document.createElement('div');
    div.id = `msg-${m.id}`;
    div.className = `card ${m.type === 'web' ? 'web-user' : ''}`;
    
    let htmlGambar = '';
    if (m.imageUrl) {
      htmlGambar = `<a href="${m.imageUrl}" target="_blank">
                      <img src="${m.imageUrl}" class="chat-img" alt="Lampiran Gambar" loading="lazy" />
                    </a>`;
    }

    div.innerHTML = `
      <div class="sender">${escapeHtml(m.sender)}</div>
      ${htmlGambar}
      <div class="text">${escapeHtml(m.text)}</div>
    `;
    
    chatBox.appendChild(div);
  }

  async function kirimPesanWeb() {
    const input = document.getElementById('pesanInput');
    const teks = input.value.trim();
    if (!teks) return;

    await db.from('web_chat').insert([{ sender_name: 'Pengunjung Anonim', content: teks }]);
    input.value = '';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  db.channel('public-chat')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'group_messages' }, () => loadPesanTerbaru())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'web_chat' }, () => loadPesanTerbaru())
    .subscribe();

  loadPesanTerbaru();
</script>

</body>
</html>
