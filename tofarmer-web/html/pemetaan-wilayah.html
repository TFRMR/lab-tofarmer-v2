function setSync(t) { document.getElementById('sync').innerHTML = t; }
function rpc(fn, params, tok) { return sb.rpc(fn, Object.assign({ p_id: sso.id, p_pin_hash: tok }, params)).then(function (r) { if (r.error) throw r.error; return r.data; }); }

 try {

  for (var i = 0; i < kirim.length; i++) {
   var r = kirim[i], res = null;
   try { res = await rpc('regional_save', { p_rec: { uid: r.uid, jenis: r.jenis, judul: r.judul, area_id: r.area_id || null, pilar: r.pilar, asal: r.asal, status: r.status, akses: r.akses, kontributor: r.kontributor || null, d: r.d || {}, rev: r.rev || [], dibuat: r.dibuat, diubah: r.diubah } }, tok); } catch (x) { var xm = String((x && x.message) || x); if (/^Ditolak/.test(xm)) { r.galat = xm; save(); gagal.push(xm); continue; } throw x; }
   delete r.galat; if (res && res.kode) r.kode = res.kode; // kode resmi dari server
   r.synced = true; save();
  }
  while (S.dels.length) { await rpc('regional_delete', { p_uid: String(S.dels[0]) }, tok); S.dels.shift(); save(); }
  var cloud = (await rpc('regional_list', {}, tok)) || [], hasil = S.rec.filter(function (x) { return x.milik !== false && !x.synced; }), tunda = {};
  hasil.forEach(function (x) { tunda[x.uid] = 1; });
  cloud.forEach(function (c) { if (!tunda[c.uid]) hasil.push({ uid: c.uid, kode: c.kode, jenis: c.jenis, judul: c.judul, area_id: c.area_id || '', pilar: c.pilar || [], asal: c.asal || [], status: c.status, akses: c.akses, kontributor: c.kontributor || '', d: c.d || {}, rev: c.rev || [], dibuat: c.dibuat, diubah: c.diubah, pemilik_nama: c.pemilik_nama, milik: !!c.milik, nkonf: c.nkonf || 0, nusul: c.nusul || 0, synced: true }); });
  S.rec = hasil; save(); setSync(gagal.length ? '⚠ ' + gagal.length + ' rekaman ditolak server: ' + esc(gagal[0]) + ' (lihat tanda ⚠ di daftar)' : '<b>Tersinkron</b> ' + new Date().toLocaleTimeString('id-ID'));
  if (manual) toast('Sinkron selesai');
  if (tab != 'form' && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();

  var m = String((err && err.message) || err);
  setSync(/PIN salah|akun tidak valid|Sesi tidak/i.test(m) ? 'Sesi tidak berlaku. <a href="' + loginHref() + '"><b>Masuk lagi</b></a>; datamu aman di perangkat.' : /Could not find the function|schema cache/i.test(m) ? 'Tabel dan fungsi Supabase pemetaan belum dipasang (jalankan SQL-nya dulu). Data aman di perangkat.' : /Batas|terlalu besar|Hanya/i.test(m) ? esc(m) : 'Sinyal belum cukup atau server sibuk. Data antre, dicoba lagi otomatis.');
 }

}

 return '<div class="card"><h3>Mulai dari sini</h3><p class="hint">Ketuk judul bagian untuk membukanya. Tidak perlu membaca semuanya. Pilih jalurmu:</p>' +
  '<p><b>Aku mau membaca saja</b> → buka bagian 1, 2, 3, 4, 10.<br><b>Aku mau ikut mengisi</b> → buka bagian 1 sampai 9.<br><b>Aku mau membantu melengkapi catatan orang lain</b> → buka bagian 11, 12, 13.<br><b>Aku bingung ini apa</b> → mulai dari bagian 1 dan 5.</p></div>' +

 pd('1. Halaman ini untuk apa?', '<p>Anggap saja <b>buku catatan bersama untuk satu kampung atau satu daerah</b>. Isinya: siapa yang bisa apa, apa yang dimiliki alam dan lahan, alat dan bengkel yang ada, usaha warga, ilmu turun-temurun, dan masalah yang dirasakan masyarakat.</p><p>Tujuannya bukan menilai atau mengurutkan warga. Tujuannya <b>mengenali dan mencatat kekayaan yang sudah ada</b> supaya tidak hilang dan bisa saling dihubungkan. Contoh: seorang petani senior yang paham membaca musim + seorang tukang las + sebuah lahan percobaan bisa jadi cikal bakal alat tani baru. Hubungan seperti itu baru kelihatan kalau semuanya tercatat di satu tempat.</p><p>Datanya tersimpan di internet (cloud), jadi banyak orang bisa membantu mengisi, membenarkan, dan melengkapi, seperti Wikipedia versi sederhana.</p>', true) +

 pd('2. Masuk (login) dan cara data tersimpan', '<p><b>Kenapa wajib masuk?</b> Supaya setiap catatan jelas siapa pencatatnya dan ada yang bertanggung jawab. Pakai akun ToFarmer yang sama dengan halaman lain.</p><p><b>Kalau sinyal hilang?</b> Tetap bisa mengisi. Catatan disimpan dulu di HP dan ditandai <b>menunggu kirim</b>. Saat sinyal kembali, terkirim sendiri.</p><p><b>Tulisan kecil di bawah judul halaman</b> adalah status sinkron: <i>Tersinkron</i> berarti semua sudah aman di cloud; <i>Tanpa sinyal</i> berarti antre; <i>Sesi habis</i> berarti perlu masuk lagi (datamu tidak hilang).</p><p><b>Fitur yang butuh sinyal:</b> melihat riwayat, mengirim usulan, dan mengonfirmasi. Mengisi dan menyimpan rekaman sendiri tidak butuh sinyal.</p>') +

 pd('3. Mengenal tampilan halaman', '<h5>Tombol 📖 Panduan (kanan atas)</h5><p>Membuka panduan ini kapan saja, juga sebelum masuk.</p><h5>Menu Daftar</h5><p>Semua rekaman yang boleh kamu lihat. Di atasnya ada angka ringkasan, kotak pencarian, dan saringan jenis, wilayah, dan status. Ada juga <b>Checklist pendataan pertama</b> (15 butir) untuk memandu pekerjaan di lapangan; centang sendiri saat selesai.</p><h5>Menu Tambah</h5><p>Formulir untuk membuat rekaman baru. Saat sedang mengubah rekaman, menu ini berganti nama menjadi Ubah.</p><h5>Menu Ekspor</h5><p>Tempat mengunduh data, mencadangkan, dan memulihkan. Ada juga tombol <b>Sinkron sekarang</b>.</p><h5>Membaca satu rekaman di Daftar</h5><p>Baris atas: judul. Baris kecil di bawahnya: kode, jenis, status, tingkat akses, wilayah. Garis hijau tipis menunjukkan <b>kelengkapan isian</b> (persen kolom yang terisi). Ketuk untuk membuka seluruh isinya. Tanda kecil P1 sampai P5 adalah pilar, dan INT/OBS/DOC/TEST adalah asal informasinya.</p>') +

 pd('4. Istilah yang perlu dipahami', '<h5>Rekaman</h5><p>Satu catatan. Satu orang = satu rekaman. Satu lahan = satu rekaman. Satu tradisi = satu rekaman.</p><h5>Kode rekaman</h5><p>Nomor resmi seperti TOF-PER-0001 (PER = orang, AREA = wilayah, LAND = lahan, RES = sumber daya, KNW = kearifan, dan seterusnya). Diberikan otomatis oleh server saat pertama terkirim. Sebelum itu tampil BARU-xxxx. Kode tidak berubah walau isi direvisi.</p><h5>Area ID</h5><p>Nama atau kode wilayah tempat rekaman itu berada, misalnya Patihombo atau TOF-AREA-0001. Isi dengan penulisan yang sama di semua rekaman supaya mudah disaring.</p><h5>Lima pilar ToFarmer</h5><p>1. Komunitas dan Narasi (manusia dan jaringan sosial). 2. Inovasi dan Rekayasa (kemampuan teknis). 3. Ladang Belajar (alam dan praktik). 4. Finansial dan Investasi (aset dan ekonomi). 5. Refleksi Petapa (nilai dan kearifan). Satu rekaman boleh masuk beberapa pilar. Contoh: petani yang membuat pupuk sendiri dan pandai membaca musim bisa masuk pilar 1, 2, 3, dan 5.</p><h5>Asal informasi (wajib dipikirkan setiap mencatat)</h5><p><b>INT</b> = kamu mendengarnya dari seseorang. <b>OBS</b> = kamu melihatnya sendiri. <b>DOC</b> = dari dokumen atau tulisan. <b>TEST</b> = sudah dicoba dan ada hasilnya. Boleh lebih dari satu.</p><h5>Status kematangan</h5><p><b>D0</b> catatan mentah, belum diperiksa. <b>D1</b> sudah ada identitas, sumber, waktu, dan konteks. <b>D2</b> sudah dibenarkan orang lain. <b>D3</b> sudah dibenarkan dan diuji. <b>D4</b> jadi rujukan. <b>D5</b> ilmu baku bersama. Tidak semua data harus sampai D5; data profil wilayah cukup sampai D2.</p><h5>Tingkat akses</h5><p><b>Public</b> boleh dibaca semua pengguna. <b>Community</b> juga terlihat pengguna yang login. <b>Restricted</b> dan <b>Private</b> hanya terlihat pemilik rekaman. Data pribadi otomatis Private.</p>') +

 pd('5. Jenis rekaman: pakai yang mana?', '<p><b>Wilayah</b>: profil satu desa atau dusun (luas, penduduk, iklim, sumber air). Cukup satu per wilayah.</p><p><b>Orang / SDM</b>: satu warga dan kemampuannya. Seorang yang punya tiga keahlian boleh dibuat tiga rekaman, atau satu rekaman dengan keahlian dituliskan semua.</p><p><b>Sumber daya alam</b>: sesuatu yang ada di alam: mata air, hutan, pohon buah, ternak, limbah panen yang bisa dimanfaatkan.</p><p><b>Teknologi dan inovasi</b>: bengkel, mesin, alat buatan warga, juga ide alat yang belum jadi.</p><p><b>Lahan</b>: satu bidang lahan beserta cara menanam dan istilah setempat.</p><p><b>Eksperimen</b>: percobaan yang sedang atau sudah dilakukan, lengkap dengan hipotesis dan hasil (termasuk yang gagal).</p><p><b>Ekonomi</b>: produk atau usaha lokal, harga, pasar, dan siapa yang menikmati nilai tambahnya.</p><p><b>Kearifan lokal</b>: pengetahuan atau tradisi turun-temurun dan siapa yang masih menguasainya.</p><p><b>Komunitas</b>: kelompok tani, karang taruna, koperasi, dan sejenisnya.</p><p><b>Masalah</b>: persoalan yang dirasakan warga, apa penyebabnya, dan siapa yang bisa membantu.</p><p><b>Peluang</b>: ide pengembangan hasil menghubungkan rekaman lain. Ada lima pertanyaan penilaian (tersedia, ada yang mampu, ada kebutuhan, bisa diuji, sesuai etika).</p>') +

 pd('6. Contoh satu rekaman yang sudah terisi', '<p><i>Contoh ilustratif, bukan data warga yang sebenarnya.</i></p><h5>Jenis</h5><p>Orang / SDM</p><h5>Identitas rekaman</h5><p>Area ID: Patihombo. Pilar: 1, 3, 5. Asal informasi: INT dan OBS. Status: D1. Akses: Private (bawaan untuk orang).</p><h5>Isian formulir</h5><p>Nama atau inisial: Pak S. (sudah izin). Kategori keahlian: Alam. Keahlian: membaca tanda musim tanam dari bintang dan arah angin. Asal ilmu: warisan dari orang tua, dipraktikkan sejak muda. Lama: sekitar 40 tahun. Pernah mengajarkan: Sebagian. Bersedia membagikan atau jadi mentor: Ya.</p><p>Perhatikan: tidak semua kolom harus terisi, dan kolom yang belum diketahui dibiarkan kosong, bukan diisi tebakan.</p>') +

 pd('7. Langkah demi langkah mengisi (pertama kali)', '<p><b>Langkah 1.</b> Masuk dengan akun ToFarmer.</p><p><b>Langkah 2.</b> Tekan menu <b>Tambah</b> (atau tombol + Tambah rekaman di Daftar).</p><p><b>Langkah 3.</b> Di kotak <b>Jenis rekaman</b>, pilih <b>Wilayah</b>. Kalau wilayahmu sudah pernah dibuat orang lain (cek di Daftar, saring jenis Wilayah), tidak perlu membuat lagi. Lanjut ke langkah 6 dengan jenis lain.</p><p><b>Langkah 4.</b> Isi <b>Identitas rekaman</b>: Area ID (nama wilayah), Kontributor (otomatis namamu), centang <b>Pilar</b> dan <b>Asal informasi</b>, pilih Status (mulai D0 atau D1) dan Tingkat akses.</p><p><b>Langkah 5.</b> Isi kolom di bagian bawah. Kolom bertanda * wajib. Sisanya sebisanya. Tekan <b>Simpan rekaman</b>.</p><p><b>Langkah 6.</b> Kembali ke Daftar. Rekaman baru tampil dengan kode BARU-xxxx dan tulisan menunggu kirim. Tunggu status di bawah judul berubah <b>Tersinkron</b>. Kode berganti menjadi kode resmi.</p><p><b>Langkah 7.</b> Tambah rekaman berikutnya. Setiap kali, isi Area ID dengan penulisan yang sama.</p><p><b>Urutan yang disarankan:</b> Wilayah, lalu warga dan petani senior, kearifan lokal, alam dan lahan, bengkel dan alat, usaha, masalah, terakhir peluang. Tiga rekaman per hari sudah bagus. Kualitas dan kesinambungan lebih penting daripada jumlah.</p>') +

 pd('8. Tips saat wawancara di lapangan', '<p>&bull; Perkenalkan tujuan pendataan, minta izin, dan jangan memaksa. Boleh merekam suara atau memotret hanya dengan izin.</p><p>&bull; Catat kata asli narasumber, termasuk istilah daerah. Jangan menghaluskan atau mengubah maknanya.</p><p>&bull; Tunjukkan kembali catatanmu supaya narasumber bisa mengoreksi.</p><p>&bull; Jangan menjanjikan keuntungan yang belum pasti.</p><p><b>Pertanyaan pembuka yang bagus untuk kearifan lokal:</b></p><p>1. Bagaimana orang tua dahulu menentukan waktu tanam?<br>2. Tanda alam apa yang dipakai untuk membaca pergantian musim?<br>3. Ada tanaman lokal yang dulu banyak dipakai tapi sekarang hilang?<br>4. Ada cara mengelola tanah atau air yang diwariskan?<br>5. Pengetahuan apa yang menurut Bapak/Ibu mulai dilupakan generasi sekarang?</p><p>Catat dulu sebagai pengetahuan lokal. Jangan langsung dianggap terbukti ilmiah; kalau perlu, nanti diuji bersama warga.</p>') +

 pd('9. Mengubah, melengkapi, atau menghapus rekaman sendiri', '<p>Buka rekaman di Daftar, tekan <b>Ubah / lengkapi</b>, perbaiki isian, lalu <b>Simpan</b>. Kode tidak berubah. Setiap simpan tercatat di riwayat revisi beserta isi lamanya.</p><p>Peringatan: kalau isi diubah, status yang sudah D2 atau lebih turun kembali ke D1 dan konfirmasi orang lain dihapus, karena konfirmasi itu untuk isi yang lama. Mengubah hanya Tingkat akses atau Pilar tidak menurunkan status; hanya perubahan isi isian yang menurunkannya.</p><p><b>Hapus</b> menghapus rekaman dari cloud juga, termasuk riwayat, usulan, dan konfirmasinya, dan tidak bisa dibatalkan. Jangan menghapus rekaman yang sudah dikonfirmasi orang lain kecuali memang salah total.</p>') +

 pd('10. Khusus pembaca: cara membaca dan menilai data', '<p>1. Pakai kotak pencarian untuk kata kunci (misalnya nama tanaman atau keahlian). Saring wilayah supaya hanya satu kampung yang tampil.</p><p>2. Lihat <b>status</b>: D0 dan D1 adalah catatan awal. D2 ke atas sudah dibenarkan orang lain. Jangan menjadikan D0 sebagai dasar keputusan penting.</p><p>3. Lihat <b>asal informasi</b>: TEST lebih kuat dari INT. INT berarti kata narasumber, belum tentu terbukti.</p><p>4. Lihat <b>kelengkapan</b> (garis hijau). Rekaman yang baru terisi sedikit masih bisa dilengkapi, lihat bagian 11.</p><p>5. Kamu hanya melihat rekaman Public dan Community orang lain. Kalau ada rekaman yang tidak muncul, kemungkinan memang tidak dibagikan pemiliknya.</p><p>6. Mau memakai datanya? Lihat bagian 15 (Ekspor).</p>') +

 pd('11. Membantu melengkapi catatan orang lain (usulan)', '<p>Pakai ini kalau kamu tahu sesuatu yang kurang atau keliru pada catatan orang lain.</p><p><b>Langkah 1.</b> Di Daftar, buka rekaman orang lain, tekan <b>Usulkan perubahan</b>.</p><p><b>Langkah 2.</b> Ubah hanya kolom yang perlu. Kolom lain biarkan.</p><p><b>Langkah 3.</b> Di bagian <b>Dasar usulan</b>, tulis <b>alasan</b>: apa yang kamu lihat atau ketahui. Pilih <b>asal informasi</b> (minimal satu).</p><p><b>Langkah 4.</b> Tekan <b>Kirim usulan</b>. Perubahan <b>belum langsung berlaku</b>; menunggu keputusan pemilik rekaman atau kurator.</p><p>Batasan: satu usulan yang menunggu per rekaman per orang. Rekaman Private dan Restricted tidak bisa diusulkan. Kamu bisa melihat nasib usulanmu di <b>Riwayat &amp; kerja sama</b> pada rekaman itu.</p>') +

 pd('12. Membenarkan catatan orang lain (konfirmasi)', '<p>Pakai ini kalau kamu mengetahui langsung bahwa isi catatan itu benar.</p><p><b>Langkah 1.</b> Di Daftar, buka rekaman, tekan <b>Riwayat &amp; kerja sama</b>.</p><p><b>Langkah 2.</b> Di bagian <b>Konfirmasi silang</b>, tulis catatan singkat apa yang kamu ketahui atau lihat, pilih asal informasi.</p><p><b>Langkah 3.</b> Tekan <b>Kirim konfirmasi</b>.</p><p>Konfirmasi dari orang lain inilah yang memungkinkan rekaman naik ke D2 atau D3. Kamu tidak bisa mengonfirmasi rekamanmu sendiri. Kalau ragu, jangan konfirmasi; tulis saja sebagai usulan.</p>') +

 pd('13. Kalau ada usulan masuk ke rekamanku', '<p>Tanda <b>🔔 n usulan</b> muncul di baris rekamanmu.</p><p><b>Langkah 1.</b> Buka rekaman, tekan <b>Riwayat &amp; kerja sama</b>.</p><p><b>Langkah 2.</b> Di bagian <b>Usulan perubahan</b>, ketuk usulan untuk membuka. Kamu melihat isi lama (dicoret) dan isi baru, alasan, dan asal informasinya.</p><p><b>Langkah 3.</b> Tekan <b>Terima</b> kalau usulannya benar; isi rekaman langsung berubah dan nama pengusul tercatat. Tekan <b>Tolak</b> kalau tidak sesuai, dan tulis alasannya agar pengusul paham.</p><p>Kalau rekamanmu sudah berubah sejak usulan dibuat, server menolak penerapan dan kamu diminta menolak usulan itu lalu meminta pengusul mengajukan ulang. Kurator juga boleh memutuskan usulan di rekaman siapa pun, tetapi tidak boleh memutuskan usulannya sendiri.</p>') +

 pd('14. Naik status: cara kerjanya', '<p><b>D0 dan D1</b>: bisa kamu pilih sendiri saat menyimpan.</p><p><b>D2 Verified</b>: perlu 1 konfirmasi dari orang lain.</p><p><b>D3 Validated</b>: perlu 2 konfirmasi dari orang lain.</p><p><b>D4 dan D5</b>: hanya kurator yang bisa memberikannya.</p><p>Contoh: kamu mencatat tradisi tanam (D1). Dua warga lain membuka rekamanmu dan masing-masing mengonfirmasi. Kamu kemudian mengubah status ke D3 dan menyimpan. Server menerima karena syaratnya terpenuhi. Kalau kamu coba D3 tanpa konfirmasi, muncul tanda ⚠ ditolak server.</p><p>Kalau isi rekaman kemudian diubah, status kembali ke D1 dan konfirmasi harus diulang.</p>') +

 pd('15. Memanfaatkan data (menu Ekspor)', '<p><b>Sinkron sekarang</b>: paksa kirim dan tarik data terbaru.</p><p><b>Pengaturan ekspor</b>: pilih wilayah tertentu atau semua. Kotak "sertakan Restricted dan Private" jangan dicentang kalau hasilnya akan dibagikan.</p><p><b>Data AI (.jsonl)</b>: berkas khusus untuk AI. Satu baris per rekaman berisi kalimat narasi, isian terstruktur, asal informasi, dan status. Dipakai nanti untuk analisis atau melatih asisten, jadi tidak perlu mengisi dua kali.</p><p><b>JSON terstruktur</b>: data lengkap untuk pemrogram atau aplikasi lain.</p><p><b>CSV semua jenis</b> atau <b>CSV satu jenis</b>: dibuka di Excel atau Google Sheets. CSV satu jenis kolomnya sesuai formulir, paling enak untuk dihitung dan disaring.</p><p><b>Regional Profile (Markdown)</b>: laporan per wilayah yang enak dibaca, berurutan menurut jenis.</p><p><b>Cadangan penuh (JSON)</b>: semua rekaman milikmu. Simpan berkala di tempat aman, dan bisa dipakai untuk <b>Impor</b> di perangkat lain. Impor menggabungkan tanpa membuat ganda.</p><p><b>Hapus salinan perangkat</b>: hanya membersihkan HP ini, lalu menarik ulang dari cloud. Data cloud tidak terhapus, tetapi rekaman yang belum terkirim ikut hilang, jadi pastikan status sudah Tersinkron dulu.</p><p><b>Mencari peluang:</b> pertemukan satu rekaman Orang (punya keahlian), Lahan (punya tempat), dan Masalah (butuh solusi). Ide yang muncul dicatat sebagai jenis Peluang.</p>') +

 pd('16. Aturan emas dan etika', '<p>&bull; Jangan mengarang. Kalau hanya perkiraan, tulis (estimasi). Pisahkan data nyata, estimasi, dan skenario.</p><p>&bull; Minta izin sebelum mencatat nama, kontak, atau memotret orang.</p><p>&bull; Pengetahuan adat atau data pribadi yang tidak boleh disebar jangan diberi akses Public.</p><p>&bull; Koordinat aset yang rawan disalahgunakan (misalnya lokasi ternak atau alat mahal) jangan Public.</p><p>&bull; Masyarakat tetap pemilik pengetahuan yang mereka bagikan; mereka berhak meminta koreksi atau penghapusan.</p><p>&bull; Masalah warga tidak otomatis peluang bisnis. Ada yang lebih tepat diselesaikan dengan gotong royong, pendidikan, atau perlindungan lingkungan.</p><p>&bull; Tidak semua sumber daya harus dimanfaatkan. Yang perlu dilindungi juga dicatat.</p>') +

 pd('17. Kalau ada yang tidak beres', '<p><b>"menunggu kirim" tidak hilang-hilang.</b> Cek sinyal, lalu buka Ekspor dan tekan Sinkron sekarang.</p><p><b>"Sesi habis, masuk lagi".</b> Masuk ulang dari tombol Masuk. Data di HP tetap aman.</p><p><b>⚠ ditolak server.</b> Baca pesannya. Penyebab paling umum: status D2 atau D3 tanpa konfirmasi cukup. Ubah status ke D1 lalu simpan lagi.</p><p><b>"Tabel dan fungsi Supabase pemetaan belum dipasang".</b> Itu urusan pengelola situs, bukan salahmu. Laporkan ke pengelola.</p><p><b>Kode masih BARU-xxxx.</b> Belum pernah terkirim. Tunggu sinkron.</p><p><b>Rekaman orang lain tidak bisa kuubah.</b> Memang begitu. Pakai Usulkan perubahan.</p><p><b>Tombol Riwayat &amp; kerja sama tidak ada.</b> Rekaman itu belum terkirim ke cloud; tunggu sinkron.</p><p><b>Salah mengisi sesuatu.</b> Buka Ubah / lengkapi dan perbaiki; versi lama tetap tersimpan di riwayat.</p>') +

 pd('18. Gambaran satu hari kerja di lapangan', '<p><b>Pagi.</b> Masuk ke aplikasi sebelum berangkat (selagi ada sinyal) supaya sesi aktif. Buka Daftar dan lihat apa yang sudah ada tentang wilayah yang dikunjungi.</p><p><b>Di lapangan.</b> Wawancara tiga orang. Setiap selesai, buat rekaman: orang, keahlian, dan kearifan yang diceritakan. Tidak perlu lengkap; yang penting tercatat saat masih segar.</p><p><b>Sore.</b> Lengkapi rekaman yang masih kosong. Pilih asal informasi dengan jujur.</p><p><b>Malam.</b> Begitu ada sinyal, buka halaman dan lihat status <i>Tersinkron</i>. Seminggu sekali, unduh Cadangan penuh.</p><p>Kalau hari itu hanya mendapat tiga narasumber, itu sudah kemajuan.</p>');
}

// ---------- Kerja sama: riwayat isi lama, usulan perubahan, konfirmasi silang (ala Wikipedia, versi simpel) ----------
function tokAda() { var t = null; try { t = TofSesi.token(); } catch (e) {} if (!t || !sb || !navigator.onLine) { toast(t ? 'Fitur ini perlu sinyal' : 'Sesi habis, masuk lagi'); return null; } return t; }
function labF(jenis, k) { var T = tipe(jenis), f = T && T.f.filter(function (x) { return x[0] == k; })[0]; return f ? lab(f[1]) : k; }
function tgl(v) { try { return new Date(v).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return v; } }
function beda(jenis, p) { return Object.keys(p || {}).map(function (k) { var x = p[k] || {}; return '<h5>' + esc(labF(jenis, k)) + '</h5><p><s style="color:#9a3b3b">' + esc(x.lama || '(kosong)') + '</s>\n→ ' + esc(x.baru || '(kosong)') + '</p>'; }).join(''); }
function asalTag(a) { return (a || []).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join(''); }
function asalBox(cls) { return ASAL.map(function (a) { return '<label class="chk"><input type="checkbox" class="' + cls + '" value="' + a[0] + '">' + a[0] + ' · ' + a[1] + '</label>'; }).join(''); }
function pilihAsal(cls) { var as = []; Array.prototype.forEach.call(document.querySelectorAll('.' + cls + ':checked'), function (x) { as.push(x.value); }); return as; }
function pesan(e) { return String((e && e.message) || e || 'Gagal, coba lagi'); }

function bukaDetail(id) { detId = id; DET = null; tab = 'detail'; render(); muatDetail(); }
async function muatDetail() {
 var tok = tokAda(); if (!tok) { go('daftar'); return; }
 try { DET = await rpc('regional_detail', { p_uid: detId }, tok); } catch (e) { toast(pesan(e)); go('daftar'); return; }
 if (tab == 'detail') render();
}
function detail() {
 var r = cari(detId); if (!r) return '<div class="card"><p class="hint">Rekaman tidak ditemukan.</p><button class="btn alt" onclick="go(\'daftar\')">Kembali</button></div>';
 var T = tipe(r.jenis), h = '<div class="card"><h3>' + esc(r.judul) + '</h3><div class="stat">' + esc(r.kode) + ' · ' + esc(T.n) + ' · <b>' + esc(r.status) + '</b></div><div class="acts"><button class="btn alt" onclick="go(\'daftar\')">← Kembali</button>' + (r.milik === false ? '<button class="btn" onclick="usulkan(\'' + r.uid + '\')">Usulkan perubahan</button>' : '') + '</div></div>';
 if (!DET) return h + '<div class="card"><p class="hint">Memuat riwayat...</p></div>';
 var kf = DET.konfirmasi || [], sudah = kf.some(function (k) { return k.milik; });
 h += '<div class="card"><h3>Konfirmasi silang (' + kf.length + ')</h3><p class="hint">Orang lain yang membenarkan isi rekaman ini. D2 butuh 1 konfirmasi, D3 butuh 2. Setiap isi diubah, konfirmasi dihitung ulang.</p>' +
  kf.map(function (k) { return '<div class="dg"><h5>' + esc(k.oleh_nama || '?') + ' · ' + tgl(k.waktu) + '</h5>' + asalTag(k.asal) + '<p>' + esc(k.catatan) + '</p></div>'; }).join('') +
  (DET.milik ? '<p class="hint">Rekaman milikmu tidak bisa kamu konfirmasi sendiri.</p>' : '<label for="kf_cat">' + (sudah ? 'Perbarui konfirmasimu' : 'Konfirmasi rekaman ini') + ' <small>(apa yang kamu ketahui atau lihat)</small></label><textarea id="kf_cat"></textarea><label>Asal informasi *</label>' + asalBox('kfa') + '<div class="acts"><button class="btn" onclick="konfirmasi()">Kirim konfirmasi</button></div>') + '</div>';
 var us = DET.usulan || [];
 h += '<div class="card"><h3>Usulan perubahan (' + us.length + ')</h3>' + (us.length ? '' : '<p class="hint">Belum ada usulan.</p>') + us.map(function (u) {
  return '<details><summary>' + esc(u.pengaju_nama || '?') + ' · ' + esc(u.status) + '<i>' + tgl(u.dibuat) + '</i></summary><div class="dg">' + beda(r.jenis, u.perubahan) + '<h5>Alasan</h5><p>' + esc(u.alasan) + '</p>' + asalTag(u.asal) + (u.catatan_keputusan ? '<h5>Catatan keputusan</h5><p>' + esc(u.catatan_keputusan) + '</p>' : '') +
   (DET.boleh_putuskan && u.status == 'menunggu' ? '<div class="acts"><button class="btn" onclick="putuskan(\'' + u.id + '\',true)">Terima</button><button class="btn bad" onclick="putuskan(\'' + u.id + '\',false)">Tolak</button></div>' : '') + '</div></details>';
 }).join('') + '</div>';
 var rv = DET.riwayat || [];
 return h + '<div class="card"><h3>Riwayat revisi (' + rv.length + ')</h3>' + rv.map(function (v) {
  return '<details><summary>Versi ' + v.versi + ' · ' + esc(v.oleh_nama || '?') + (v.jenis == 'usulan' ? ' (usulan)' : '') + '<i>' + tgl(v.waktu) + ' · ' + esc(v.ringkasan || '') + '</i></summary><div class="dg">' + beda(r.jenis, v.perubahan) + (v.status_lama != v.status_baru ? '<h5>Status</h5><p>' + esc(v.status_lama || '-') + ' → ' + esc(v.status_baru || '-') + '</p>' : '') + '</div></details>';
 }).join('') + '</div>';
}
async function konfirmasi() {
 var tok = tokAda(); if (!tok) return; var cat = document.getElementById('kf_cat').value.trim(), as = pilihAsal('kfa');
 if (!cat || !as.length) { toast('Isi catatan dan pilih minimal satu asal informasi'); return; }
 try { await rpc('regional_konfirmasi_set', { p_uid: detId, p_catatan: cat, p_asal: as, p_nama: sso.username }, tok); toast('Konfirmasi tersimpan'); DET = null; render(); muatDetail(); sync(); } catch (e) { toast(pesan(e)); }
}
async function putuskan(id, ya) {
 var tok = tokAda(); if (!tok) return; var cat = ya ? '' : (prompt('Alasan menolak (boleh kosong)') || '');
 try { await rpc('regional_usul_putuskan', { p_usul_id: id, p_terima: ya, p_catatan: cat }, tok); toast(ya ? 'Usulan diterapkan' : 'Usulan ditolak'); DET = null; render(); muatDetail(); sync(); } catch (e) { toast(pesan(e)); }
}
function usulkan(id) { usulId = id; tab = 'usul'; render(); }
function formUsul() {
 var e = cari(usulId); if (!e) return ''; var T = tipe(e.jenis);
 return '<p class="hint">Ubah hanya bagian yang menurutmu kurang tepat atau perlu dilengkapi. Perubahan berlaku setelah disetujui pemilik rekaman atau kurator, dan tercatat di riwayat dengan namamu.</p><div class="card"><h3>Usulan untuk: ' + esc(e.judul) + ' (' + esc(e.kode) + ')</h3>' +
  T.f.map(function (x) {
   var id = 'u_' + x[0], v = e.d[x[0]], s = '<label for="' + id + '">' + esc(x[1]) + '</label>';
   if (x[2] == 'a') return s + '<textarea id="' + id + '">' + esc(v) + '</textarea>';
   if (x[2] == 's') return s + '<select id="' + id + '"><option value="">-</option>' + x[3].filter(Boolean).map(function (o) { return '<option' + (v == o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
   return s + '<input id="' + id + '" value="' + esc(v) + '">';
  }).join('') + '</div><div class="card"><h3>Dasar usulan</h3><label for="u_alasan">Alasan: apa yang kamu amati atau ketahui *</label><textarea id="u_alasan"></textarea><label>Asal informasi * <small>(minimal satu)</small></label>' + asalBox('ua') + '</div>' +
  '<div class="acts"><button class="btn" onclick="kirimUsul()">Kirim usulan</button><button class="btn alt" onclick="bukaDetail(\'' + e.uid + '\')">Batal</button></div>';
}
async function kirimUsul() {
 var e = cari(usulId), T = tipe(e.jenis), tok = tokAda(); if (!tok) return; var p = {}, n = 0;
 T.f.forEach(function (x) { var v = document.getElementById('u_' + x[0]).value.trim(); if (v !== String(e.d[x[0]] || '').trim()) { p[x[0]] = v; n++; } });
 var al = document.getElementById('u_alasan').value.trim(), as = pilihAsal('ua');
 if (!n) { toast('Belum ada yang diubah'); return; } if (al.length < 5 || !as.length) { toast('Isi alasan dan pilih minimal satu asal informasi'); return; }
 try { await rpc('regional_usul', { p_uid: e.uid, p_perubahan: p, p_alasan: al, p_asal: as, p_nama: sso.username }, tok); toast('Usulan terkirim, menunggu keputusan pemilik'); bukaDetail(e.uid); } catch (x) { toast(pesan(x)); }
}

window.addEventListener('online', function () { sync(); });
render(); sync();
</script>
