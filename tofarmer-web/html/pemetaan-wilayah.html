// ---------- Sinkron: antre di perangkat, kirim saat ada sinyal dan sesi (pola sama dengan tumbuhan.html) ----------
function setSync(t) { document.getElementById('sync').innerHTML = t; }
function rpc(fn, params, tok) { return sb.rpc(fn, Object.assign({ p_id: sso.id, p_pin_hash: tok }, params)).then(function (r) { if (r.error) throw r.error; return r.data; }); }

   r.synced = true; save();
  }
  while (S.dels.length) { await rpc('regional_delete', { p_uid: String(S.dels[0]) }, tok); S.dels.shift(); save(); }
  var cloud = (await rpc('regional_list', {}, tok)) || [], hasil = S.rec.filter(function (x) { return x.milik !== false && !x.synced; }), tunda = {};
  hasil.forEach(function (x) { tunda[x.uid] = 1; });
  cloud.forEach(function (c) { if (!tunda[c.uid]) hasil.push({ uid: c.uid, kode: c.kode, jenis: c.jenis, judul: c.judul, area_id: c.area_id || '', pilar: c.pilar || [], asal: c.asal || [], status: c.status, akses: c.akses, kontributor: c.kontributor || '', d: c.d || {}, rev: c.rev || [], dibuat: c.dibuat, diubah: c.diubah, pemilik_nama: c.pemilik_nama, milik: !!c.milik, nkonf: c.nkonf || 0, nusul: c.nusul || 0, synced: true }); });

  if (manual) toast('Sinkron selesai');
  if (tab != 'form' && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();
 } catch (err) {
  var m = String((err && err.message) || err);
  setSync(/PIN salah|akun tidak valid|Sesi tidak/i.test(m) ? 'Sesi tidak berlaku. <a href="' + loginHref() + '"><b>Masuk lagi</b></a>; datamu aman di perangkat.' : /Could not find the function|schema cache/i.test(m) ? 'Tabel dan fungsi Supabase pemetaan belum dipasang (jalankan SQL-nya dulu). Data aman di perangkat.' : /Batas|terlalu besar|Hanya/i.test(m) ? esc(m) : 'Sinyal belum cukup atau server sibuk. Data antre, dicoba lagi otomatis.');

}

}
function detail() {
 var r = cari(detId); if (!r) return '<div class="card"><p class="hint">Rekaman tidak ditemukan.</p><button class="btn alt" onclick="go(\'daftar\')">Kembali</button></div>';
 var T = tipe(r.jenis), h = '<div class="card"><h3>' + esc(r.judul) + '</h3><div class="stat">' + esc(r.kode) + ' · ' + esc(T.n) + ' · <b>' + esc(r.status) + '</b></div><div class="acts"><button class="btn alt" onclick="go(\'daftar\')">← Kembali</button>' + (r.milik === false ? '<button class="btn" onclick="usulkan(\'' + r.uid + '\')">Usulkan perubahan</button>' : '') + '</div></div>';
 if (!DET) return h + '<div class="card"><p class="hint">Memuat riwayat...</p></div>';
 var kf = DET.konfirmasi || [], sudah = kf.some(function (k) { return k.milik; });
 h += '<div class="card"><h3>Konfirmasi silang (' + kf.length + ')</h3><p class="hint">Orang lain yang membenarkan isi rekaman ini. D2 butuh 1 konfirmasi, D3 butuh 2. Setiap isi diubah, konfirmasi dihitung ulang.</p>' +
  kf.map(function (k) { return '<div class="dg"><h5>' + esc(k.oleh_nama || '?') + ' · ' + tgl(k.waktu) + '</h5>' + asalTag(k.asal) + '<p>' + esc(k.catatan) + '</p></div>'; }).join('') +
  (DET.milik ? '<p class="hint">Rekaman milikmu tidak bisa kamu konfirmasi sendiri.</p>' : '<label for="kf_cat">' + (sudah ? 'Perbarui konfirmasimu' : 'Konfirmasi rekaman ini') + ' <small>(apa yang kamu ketahui atau lihat)</small></label><textarea id="kf_cat"></textarea><label>Asal informasi *</label>' + asalBox('kfa') + '<div class="acts"><button class="btn" onclick="konfirmasi()">Kirim konfirmasi</button></div>') + '</div>';
 var us = DET.usulan || [];
 h += '<div class="card"><h3>Usulan perubahan (' + us.length + ')</h3>' + (us.length ? '' : '<p class="hint">Belum ada usulan.</p>') + us.map(function (u) {
  return '<details><summary>' + esc(u.pengaju_nama || '?') + ' · ' + esc(u.status) + '<i>' + tgl(u.dibuat) + '</i></summary><div class="dg">' + beda(r.jenis, u.perubahan) + '<h5>Alasan</h5><p>' + esc(u.alasan) + '</p>' + asalTag(u.asal) + (u.catatan_keputusan ? '<h5>Catatan keputusan</h5><p>' + esc(u.catatan_keputusan) + '</p>' : '') +
   (DET.boleh_putuskan && u.status == 'menunggu' ? '<div class="acts"><button class="btn" onclick="putuskan(\'' + u.id + '\',true)">Terima</button><button class="btn bad" onclick="putuskan(\'' + u.id + '\',false)">Tolak</button></div>' : '') + '</div></details>';
 }).join('') + '</div>';
 var rv = DET.riwayat || [];
 return h + '<div class="card"><h3>Riwayat revisi (' + rv.length + ')</h3>' + rv.map(function (v) {
  return '<details><summary>Versi ' + v.versi + ' · ' + esc(v.oleh_nama || '?') + (v.jenis == 'usulan' ? ' (usulan)' : '') + '<i>' + tgl(v.waktu) + ' · ' + esc(v.ringkasan || '') + '</i></summary><div class="dg">' + beda(r.jenis, v.perubahan) + (v.status_lama != v.status_baru ? '<h5>Status</h5><p>' + esc(v.status_lama || '-') + ' → ' + esc(v.status_baru || '-') + '</p>' : '') + '</div></details>';
 }).join('') + '</div>';
}
async function konfirmasi() {
 var tok = tokAda(); if (!tok) return; var cat = document.getElementById('kf_cat').value.trim(), as = pilihAsal('kfa');
 if (!cat || !as.length) { toast('Isi catatan dan pilih minimal satu asal informasi'); return; }
 try { await rpc('regional_konfirmasi_set', { p_uid: detId, p_catatan: cat, p_asal: as, p_nama: sso.username }, tok); toast('Konfirmasi tersimpan'); DET = null; render(); muatDetail(); sync(); } catch (e) { toast(pesan(e)); }
}
async function putuskan(id, ya) {
 var tok = tokAda(); if (!tok) return; var cat = ya ? '' : (prompt('Alasan menolak (boleh kosong)') || '');
 try { await rpc('regional_usul_putuskan', { p_usul_id: id, p_terima: ya, p_catatan: cat }, tok); toast(ya ? 'Usulan diterapkan' : 'Usulan ditolak'); DET = null; render(); muatDetail(); sync(); } catch (e) { toast(pesan(e)); }
}
function usulkan(id) { usulId = id; tab = 'usul'; render(); }
function formUsul() {
 var e = cari(usulId); if (!e) return ''; var T = tipe(e.jenis);
 return '<p class="hint">Ubah hanya bagian yang menurutmu kurang tepat atau perlu dilengkapi. Perubahan berlaku setelah disetujui pemilik rekaman atau kurator, dan tercatat di riwayat dengan namamu.</p><div class="card"><h3>Usulan untuk: ' + esc(e.judul) + ' (' + esc(e.kode) + ')</h3>' +
  T.f.map(function (x) {
   var id = 'u_' + x[0], v = e.d[x[0]], s = '<label for="' + id + '">' + esc(x[1]) + '</label>';
   if (x[2] == 'a') return s + '<textarea id="' + id + '">' + esc(v) + '</textarea>';
   if (x[2] == 's') return s + '<select id="' + id + '"><option value="">-</option>' + x[3].filter(Boolean).map(function (o) { return '<option' + (v == o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
   return s + '<input id="' + id + '" value="' + esc(v) + '">';
  }).join('') + '</div><div class="card"><h3>Dasar usulan</h3><label for="u_alasan">Alasan: apa yang kamu amati atau ketahui *</label><textarea id="u_alasan"></textarea><label>Asal informasi * <small>(minimal satu)</small></label>' + asalBox('ua') + '</div>' +
  '<div class="acts"><button class="btn" onclick="kirimUsul()">Kirim usulan</button><button class="btn alt" onclick="bukaDetail(\'' + e.uid + '\')">Batal</button></div>';
}
async function kirimUsul() {
 var e = cari(usulId), T = tipe(e.jenis), tok = tokAda(); if (!tok) return; var p = {}, n = 0;
 T.f.forEach(function (x) { var v = document.getElementById('u_' + x[0]).value.trim(); if (v !== String(e.d[x[0]] || '').trim()) { p[x[0]] = v; n++; } });
 var al = document.getElementById('u_alasan').value.trim(), as = pilihAsal('ua');
 if (!n) { toast('Belum ada yang diubah'); return; } if (al.length < 5 || !as.length) { toast('Isi alasan dan pilih minimal satu asal informasi'); return; }
 try { await rpc('regional_usul', { p_uid: e.uid, p_perubahan: p, p_alasan: al, p_asal: as, p_nama: sso.username }, tok); toast('Usulan terkirim, menunggu keputusan pemilik'); bukaDetail(e.uid); } catch (x) { toast(pesan(x)); }
}

window.addEventListener('online', function () { sync(); });
render(); sync();
</script>
