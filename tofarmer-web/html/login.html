<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | ToFarmer</title>
    <style>
        :root {
            --primary: #22c55e;
            --secondary: #c9a227;
            --bg-dark: #0b1220;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1a2e26, #0b1220);
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .login-container {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }

        h2 { 
            margin-bottom: 10px; 
            color: var(--primary); 
            font-size: 24px;
        }

        .subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
        }

        input[type="password"]::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* PIN input special styling */
        #input-pin {
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal untuk PIN baru */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content h3 {
            color: var(--primary);
            font-size: 18px;
            margin-bottom: 15px;
        }

        .modal-content p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .pin-display {
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .pin-display .pin-number {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .modal-content button {
            margin-top: 10px;
            padding: 12px;
            font-size: 13px;
        }

        .modal-content button:first-of-type {
            background: rgba(34, 197, 94, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .modal-content button:last-of-type {
            margin-top: 5px;
        }

        .success-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .info-box {
            background: rgba(212, 175, 55, 0.1);
            border-left: 3px solid var(--secondary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: left;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>🌿 Masuk ke ToFarmer</h2>
        <p class="subtitle">Ladang Digital Menoreh</p>
        
        <div class="info-box">
            📌 Login memerlukan: Username + Wallet ID + PIN 6 digit
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <input 
                type="text" 
                id="input-username" 
                placeholder="Nama Pengguna (Username)..." 
                required
                autocomplete="username"
            >
            
            <input 
                type="text" 
                id="input-wallet" 
                placeholder="Alamat Wallet (ID)..." 
                required
                autocomplete="off"
            >
            
            <input 
                type="password" 
                id="input-pin" 
                placeholder="PIN 6 Digit..." 
                maxlength="6" 
                inputmode="numeric" 
                required
                autocomplete="off"
                pattern="[0-9]{6}"
            >
            
            <div class="error-message" id="error-message"></div>
            
            <button id="login-btn" type="submit">Masuk Ladang</button>
        </form>
    </div>

    <!-- Modal untuk PIN Baru -->
    <div class="modal-backdrop" id="pin-modal">
        <div class="modal-content">
            <div class="success-icon">📌</div>
            <h3>PIN Baru Dibuat</h3>
            <p>Akun Anda belum punya PIN. Kami membuat PIN baru untuk keamanan:</p>
            
            <div class="pin-display">
                <div class="pin-number" id="new-pin-display">000000</div>
            </div>
            
            <p style="color: #ff9800; font-weight: bold;">⚠️ Simpan PIN ini dengan aman!</p>
            <p>Gunakan PIN ini untuk login selanjutnya. Jangan bagikan ke siapa pun.</p>
            
            <button id="copy-pin-btn" type="button">📋 Salin PIN ke Clipboard</button>
            <button id="confirm-pin-btn" type="button">✓ Mengerti, Lanjut</button>
        </div>
    </div>

    <script type="module" src="../js/login.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fbeb09b48aa346a8b215ec2407d8f021"}'></script>
</body>
</html>
