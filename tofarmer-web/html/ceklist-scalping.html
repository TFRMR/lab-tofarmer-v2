<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Scalping Plan</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: #475569;
            color: #fff;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .plan-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .plan-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .plan-actions {
            display: flex;
            gap: 8px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        .modal-header {
            font-size: 1.2rem;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Checklist Scalping Trading</h1>
            <button class="btn" onclick="openPlanModal()">+ Tambah Plan Baru</button>
        </header>

        <div id="plansContainer">
            <!-- Content render otomatis dari JS -->
        </div>
    </div>

    <!-- Modal Form Plan -->
    <div class="modal" id="planModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Tambah Scalping Plan</div>
            <form id="planForm" onsubmit="savePlan(event)">
                <input type="hidden" id="planId">
                <div class="form-group">
                    <label for="planTitleInput">Nama Strategy / Pair</label>
                    <input type="text" id="planTitleInput" required placeholder="Contoh: Scalping GBP/USD M5">
                </div>
                <div class="form-group">
                    <label for="planRulesInput">Aturan Checklist (Pisahkan dengan Baris Baru/Enter)</label>
                    <textarea id="planRulesInput" rows="6" required placeholder="Konfirmasi Trend H1&#10;Support / Resistance terdekat&#10;Signal Candle Rejection M5&#10;Risk Ratio Minimal 1:1.5"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closePlanModal()">Batal</button>
                    <button type="submit" class="btn">Simpan Plan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data Default yang langsung aktif jika belum ada penyimpanan lokal
        const DEFAULT_PLANS = [
            {
                id: 'plan-default-1',
                title: 'Plan Scalping Standard (M5/M15)',
                rules: [
                    'Trend Utama sesuai (Cek Timeframe H1)',
                    'Harga berada di Area Key Level (Support/Resistance)',
                    'Konfirmasi Candle Rejection / Engulfing',
                    'Stop Loss (SL) & Take Profit (TP) Terpasang',
                    'Maksimal Risk 1-2% per Trade'
                ]
            }
        ];

        let plansData = [];

        // Load data awal dari LocalStorage atau pakai Default
        function initApp() {
            const saved = localStorage.getItem('scalping_plans_data');
            if (saved) {
                try {
                    plansData = JSON.parse(saved);
                } catch(e) {
                    plansData = DEFAULT_PLANS;
                }
            } else {
                plansData = DEFAULT_PLANS;
                saveToStorage();
            }
            renderPlans();
        }

        function saveToStorage() {
            localStorage.setItem('scalping_plans_data', JSON.stringify(plansData));
        }

        // Render UI Plan ke DOM
        function renderPlans() {
            const container = document.getElementById('plansContainer');
            if (!container) return;

            if (plansData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 40px;">Belum ada rencana scalping. Klik tombol diatas untuk membuat.</p>';
                return;
            }

            container.innerHTML = plansData.map((plan, index) => {
                const rulesHtml = plan.rules.map((rule, rIdx) => `
                    <div class="checklist-item">
                        <input type="checkbox" id="check_${index}_${rIdx}">
                        <label for="check_${index}_${rIdx}">${escapeHtml(rule)}</label>
                    </div>
                `).join('');

                return `
                    <div class="plan-card">
                        <div class="plan-header">
                            <div class="plan-title">${escapeHtml(plan.title)}</div>
                            <div class="plan-actions">
                                <button class="btn btn-secondary" onclick="editCurrentPlan('${plan.id}')">Edit</button>
                                <button class="btn btn-danger" onclick="deleteCurrentPlan('${plan.id}')">Hapus</button>
                            </div>
                        </div>
                        <div class="plan-body">
                            ${rulesHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal Handler
        function openPlanModal() {
            document.getElementById('planId').value = '';
            document.getElementById('planTitleInput').value = '';
            document.getElementById('planRulesInput').value = '';
            document.getElementById('modalTitle').innerText = 'Tambah Scalping Plan';
            document.getElementById('planModal').classList.add('active');
        }

        function closePlanModal() {
            document.getElementById('planModal').classList.remove('active');
        }

        // Action Handlers
        function savePlan(event) {
            event.preventDefault();
            const id = document.getElementById('planId').value;
            const title = document.getElementById('planTitleInput').value.trim();
            const rawRules = document.getElementById('planRulesInput').value;

            // Split baris baru menjadi array rule
            const rules = rawRules.split('\n').map(r => r.trim()).filter(r => r.length > 0);

            if (id) {
                // Edit existing
                const index = plansData.findIndex(p => p.id === id);
                if (index !== -1) {
                    plansData[index].title = title;
                    plansData[index].rules = rules;
                }
            } else {
                // Add new
                const newPlan = {
                    id: 'plan_' + Date.now(),
                    title: title,
                    rules: rules
                };
                plansData.push(newPlan);
            }

            saveToStorage();
            renderPlans();
            closePlanModal();
        }

        function editCurrentPlan(id) {
            const plan = plansData.find(p => p.id === id);
            if (!plan) return;

            document.getElementById('planId').value = plan.id;
            document.getElementById('planTitleInput').value = plan.title;
            document.getElementById('planRulesInput').value = plan.rules.join('\n');
            document.getElementById('modalTitle').innerText = 'Edit Scalping Plan';
            document.getElementById('planModal').classList.add('active');
        }

        function deleteCurrentPlan(id) {
            if (confirm('Apakah Anda yakin ingin menghapus plan ini?')) {
                plansData = plansData.filter(p => p.id !== id);
                saveToStorage();
                renderPlans();
            }
        }

        // Helper untuk mencegah XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // Jalankan Inisialisasi saat file selesai dimuat
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
