<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Scalping Plan</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: #475569;
            color: #fff;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--border);
        }

        .plan-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .plan-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .plan-actions {
            display: flex;
            gap: 8px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checklist-item:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checklist-item.checked label {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        .modal-header {
            font-size: 1.2rem;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        #importFile {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Checklist Scalping Plan</h1>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="exportData()">📥 Export Data</button>
                <button class="btn btn-outline" onclick="triggerImport()">📤 Import Data</button>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                <button class="btn" onclick="openPlanModal()">+ Tambah Plan Baru</button>
            </div>
        </header>

        <div id="plansContainer">
            <!-- Render via JavaScript -->
        </div>
    </div>

    <!-- Modal Form Tambah/Edit Plan -->
    <div class="modal" id="planModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Tambah Scalping Plan</div>
            <form id="planForm" onsubmit="savePlan(event)">
                <input type="hidden" id="planId">
                <div class="form-group">
                    <label for="planTitleInput">Nama Strategy / Plan</label>
                    <input type="text" id="planTitleInput" required placeholder="Contoh: Scalping M1 SNR D1">
                </div>
                <div class="form-group">
                    <label for="planRulesInput">Aturan Checklist (Pisahkan per baris)</label>
                    <textarea id="planRulesInput" rows="7" required placeholder="Perbandingan RR 1:1&#10;Aturan entry breakout: candle M1 tembus garis SNR D1..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closePlanModal()">Batal</button>
                    <button type="submit" class="btn">Simpan Plan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Checklist Default Sesuai Aturan Khusus Anda
        const DEFAULT_PLANS = [
            {
                id: 'plan-scalping-m1',
                title: 'Plan Scalping M1 - SNR D1 & Fractal SL',
                rules: [
                    'Perbandingan RR 1:1',
                    'SL bisa di bawah/atas candle / di fractal (pilih visual yang paling masuk akal)',
                    'Ranging bisa 20 - 50 candle: Pakai SL Fractal untuk meminimalisir sapuan harga mondar-mandir',
                    'Entry Breakout: Saat candle M1 tembus garis SNR D1',
                    'Entry Pantulan: Tembus ekor / body nempel lalu langsung reverse (candle masuk & gagal)',
                    'Aturan Rapat SNR: Pada garis SNR rapat, pakai SL Fractal lebih aman',
                    'Aturan Loss: Jika Loss 2 kali, WAJIB tunggu 20 candle berjalan baru boleh cari entry lagi (karena market sedang ranging)'
                ]
            }
        ];

        let plansData = [];

        function initApp() {
            const saved = localStorage.getItem('scalping_plans_data');
            if (saved) {
                try {
                    plansData = JSON.parse(saved);
                } catch(e) {
                    plansData = DEFAULT_PLANS;
                }
            } else {
                plansData = DEFAULT_PLANS;
                saveToStorage();
            }
            renderPlans();
        }

        function saveToStorage() {
            localStorage.setItem('scalping_plans_data', JSON.stringify(plansData));
        }

        function renderPlans() {
            const container = document.getElementById('plansContainer');
            if (!container) return;

            if (plansData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 40px;">Belum ada rencana scalping. Klik "+ Tambah Plan Baru" untuk membuat.</p>';
                return;
            }

            container.innerHTML = plansData.map((plan) => {
                const rulesHtml = plan.rules.map((rule, rIdx) => `
                    <div class="checklist-item" onclick="toggleCheck(this)">
                        <input type="checkbox" id="check_${plan.id}_${rIdx}" onclick="event.stopPropagation(); toggleCheckParent(this);">
                        <label for="check_${plan.id}_${rIdx}">${escapeHtml(rule)}</label>
                    </div>
                `).join('');

                return `
                    <div class="plan-card" id="card_${plan.id}">
                        <div class="plan-header">
                            <div class="plan-title">${escapeHtml(plan.title)}</div>
                            <div class="plan-actions">
                                <button class="btn btn-secondary" onclick="editCurrentPlan('${plan.id}')">Edit</button>
                                <button class="btn btn-danger" onclick="deleteCurrentPlan('${plan.id}')">Hapus</button>
                            </div>
                        </div>
                        <div class="plan-body">
                            ${rulesHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCheck(element) {
            const checkbox = element.querySelector('input[type="checkbox"]');
            if (checkbox) {
                checkbox.checked = !checkbox.checked;
                element.classList.toggle('checked', checkbox.checked);
            }
        }

        function toggleCheckParent(checkbox) {
            const parent = checkbox.closest('.checklist-item');
            if (parent) {
                parent.classList.toggle('checked', checkbox.checked);
            }
        }

        function openPlanModal() {
            document.getElementById('planId').value = '';
            document.getElementById('planTitleInput').value = '';
            document.getElementById('planRulesInput').value = '';
            document.getElementById('modalTitle').innerText = 'Tambah Scalping Plan';
            document.getElementById('planModal').classList.add('active');
        }

        function closePlanModal() {
            document.getElementById('planModal').classList.remove('active');
        }

        function savePlan(event) {
            event.preventDefault();
            const id = document.getElementById('planId').value;
            const title = document.getElementById('planTitleInput').value.trim();
            const rawRules = document.getElementById('planRulesInput').value;

            const rules = rawRules.split('\n').map(r => r.trim()).filter(r => r.length > 0);

            if (id) {
                const index = plansData.findIndex(p => p.id === id);
                if (index !== -1) {
                    plansData[index].title = title;
                    plansData[index].rules = rules;
                }
            } else {
                const newPlan = {
                    id: 'plan_' + Date.now(),
                    title: title,
                    rules: rules
                };
                plansData.push(newPlan);
            }

            saveToStorage();
            renderPlans();
            closePlanModal();
        }

        function editCurrentPlan(id) {
            const plan = plansData.find(p => p.id === id);
            if (!plan) return;

            document.getElementById('planId').value = plan.id;
            document.getElementById('planTitleInput').value = plan.title;
            document.getElementById('planRulesInput').value = plan.rules.join('\n');
            document.getElementById('modalTitle').innerText = 'Edit Scalping Plan';
            document.getElementById('planModal').classList.add('active');
        }

        function deleteCurrentPlan(id) {
            if (confirm('Apakah Anda yakin ingin menghapus plan ini?')) {
                plansData = plansData.filter(p => p.id !== id);
                saveToStorage();
                renderPlans();
            }
        }

        // Fitur Export & Import
        function exportData() {
            if (plansData.length === 0) {
                alert('Tidak ada data plan untuk di-export.');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plansData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `scalping_plans_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedPlans = JSON.parse(e.target.result);
                    if (Array.isArray(importedPlans)) {
                        plansData = importedPlans;
                        saveToStorage();
                        renderPlans();
                        alert('Data plan berhasil di-import!');
                    } else {
                        alert('Format file JSON tidak valid.');
                    }
                } catch (err) {
                    alert('Gagal membaca file JSON: ' + err.message);
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
