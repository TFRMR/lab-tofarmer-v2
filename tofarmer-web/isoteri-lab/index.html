<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isoteri Lab — Native Web</title>
<link rel="stylesheet" href="gaya.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/"><span class="logo">I</span><span><b>Isoteri</b><small>Native Web Lab</small></span></a>
    <nav>
      <button class="aktif" data-aksi="navigasi" data-halaman="beranda">◈ <span>Beranda</span></button>
      <button data-aksi="navigasi" data-halaman="tugas">✓ <span>Tugas</span></button>
      <button data-aksi="navigasi" data-halaman="arsitektur">⌘ <span>Arsitektur</span></button>
      <button data-aksi="navigasi" data-halaman="tentang">i <span>Tentang</span></button>
    </nav>
    <div class="side-note"><span class="live"></span> Logic aplikasi berjalan di Isoteri VM.</div>
  </aside>
  <main id="app"><div class="loading">Memuat Isoteri…</div></main>
</div>
<script src="isoteri-vm.js"></script>
<script>
(async()=>{const app=document.getElementById("app");try{const r=await fetch("isoteri-lab.isoweb.json",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status+" — bundle belum tersedia");new IsoteriVM(await r.json()).jalankan()}catch(e){console.error(e);app.innerHTML='<section class="error"><h1>Bundle Isoteri belum dibuat</h1><p>'+e.message+'</p><code>isoteri ekspor-web isoteri-lab.iso -o isoteri-lab.isoweb.json</code></section>'}})();
</script>
</body>
</html>
