<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Tofarmer × Isoteri Lab</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      background: #0f1115;
      color: #e6e6e6;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subjudul {
      color: #9aa0ac;
      margin-top: 0;
    }

    .panel {
      background: #1a1d24;
      border: 1px solid #2a2e37;
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
    }

    select,
    button {
      background: #1a1d24;
      color: #e6e6e6;
      border: 1px solid #2a2e37;
      border-radius: 6px;
      padding: 8px 12px;
    }

    button {
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
    }

    #keluaran {
      min-height: 120px;
      background: #0b0d11;
      border: 1px solid #2a2e37;
      border-radius: 8px;
      padding: 16px;
    }

    #target {
      border: 1px solid #2a2e37;
      border-radius: 8px;
      padding: 16px;
      min-height: 60px;
    }

    .baris {
      padding: 4px 0;
      border-bottom: 1px dashed #2a2e37;
    }

    .error {
      color: #ff8080;
    }

    .status {
      color: #9aa0ac;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <h1>Tofarmer × Isoteri Lab</h1>

  <p class="subjudul">
    Laboratorium eksplorasi bahasa Isoteri di browser.
  </p>

  <div class="panel">

    <h2>Program Isoteri</h2>

    <p class="status">
      Pilih bundle <code>.isoweb.json</code> yang akan dijalankan
      oleh Isoteri VM.
    </p>

    <select id="pilihan">
      <option value="/isoteri-lab/program.isoweb.json">
        program.iso
      </option>

      <option value="/isoteri-lab/program_closure.isoweb.json">
        program_closure.iso
      </option>

      <option value="/isoteri-lab/program_bentuk.isoweb.json">
        program_bentuk.iso
      </option>

      <option value="/isoteri-lab/contoh_dom.isoweb.json">
        contoh_dom.iso
      </option>

      <option value="/isoteri-lab/contoh_kanvas_ws.isoweb.json">
        contoh_kanvas_ws.iso
      </option>
    </select>

    <button id="jalankan">
      ▶ Jalankan
    </button>

  </div>

  <div class="panel">

    <h2>Output Isoteri</h2>

    <div id="keluaran"></div>

  </div>

  <div class="panel">

    <h2>Target DOM</h2>

    <p class="status">
      Elemen ini sengaja disediakan untuk eksperimen DOM Isoteri.
    </p>

    <div id="target">
      <strong id="judul">Awal</strong>
    </div>
<canvas
    id="papan"
    width="400"
    height="240"
    style="
      border:1px solid #2a2e37;
      border-radius:8px;
      background:#fff;
    "
  ></canvas>
  </div>

  <div class="panel">

    <h2>Status Runtime</h2>

    <div id="status">
      Memuat Isoteri VM...
    </div>

  </div>


  <!-- Runtime Isoteri -->
  <script src="/isoteri-lab/isoteri-vm.js"></script>

  <script>

    const keluaranEl =
      document.getElementById("keluaran");

    const pilihanEl =
      document.getElementById("pilihan");

    const statusEl =
      document.getElementById("status");


    function tulisOutput(teks) {

      const div =
        document.createElement("div");

      div.className = "baris";

      div.textContent = teks;

      keluaranEl.appendChild(div);
    }


    async function jalankanBundel(nama) {

      keluaranEl.innerHTML = "";

      statusEl.textContent =
        "Memuat " + nama + "...";

      try {

        const res =
          await fetch(nama);

        if (!res.ok) {

          throw new Error(
            "Gagal memuat " +
            nama +
            " (" +
            res.status +
            ")"
          );

        }


        const bundle =
          await res.json();


        if (typeof IsoteriVM !== "function") {

          throw new Error(
            "IsoteriVM tidak ditemukan."
          );

        }


        const vm =
          new IsoteriVM(bundle, {

            tampilkan: (baris) => {

              tulisOutput(baris);

            }

          });


        statusEl.textContent =
          "Menjalankan " + nama + "...";


        vm.jalankan();


        statusEl.textContent =
          "✓ Selesai";


      } catch (e) {

        statusEl.textContent =
          "✗ Gagal";

        const div =
          document.createElement("div");

        div.className =
          "baris error";

        div.textContent =
          "Kesalahan: " + e.message;

        keluaranEl.appendChild(div);

        console.error(e);

      }

    }


    document
      .getElementById("jalankan")
      .addEventListener(
        "click",
        () => {

          jalankanBundel(
            pilihanEl.value
          );

        }
      );


    if (typeof IsoteriVM === "function") {

      statusEl.textContent =
        "✓ Isoteri VM berhasil dimuat";

    } else {

      statusEl.textContent =
        "✗ Isoteri VM tidak ditemukan";

    }

  </script>

</body>
</html>
