<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Isoteri Studio — Web tanpa JavaScript aplikasi</title>
  <link rel="stylesheet" href="gaya.css">
</head>
<body>
  <div id="app"><div class="layar-muat"><div class="spinner"></div><span>Memuat Isoteri…</span></div></div>

  <!-- JavaScript hanya sebagai bootstrap VM. Seluruh perilaku aplikasi ditulis di Isoteri. -->
  <script src="../isoteri-vm.js"></script>
  <script>
    (async () => {
      const res = await fetch("demo.isoweb.json");
      const bundel = await res.json();
      try {
        new IsoteriVM(bundel).jalankan();
      } catch (e) {
        console.error(e);
        document.getElementById("app").textContent = "Gagal menjalankan Isoteri: " + (e.message || e);
      }
    })();
  </script>
</body>
</html>
